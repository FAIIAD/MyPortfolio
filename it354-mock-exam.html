<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تجريبي IT354 | FZ</title>
    
    <!-- 1. استدعاء خط ثمانية + خط Open Sans + الأيقونات -->
    <link href="https://cdn.jsdelivr.net/npm/@dawod/thmanyah-font-web/index.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 2. قراءة المظهر المحفوظ فور فتح الصفحة -->
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>

    <!-- 3. إعدادات Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        cyan: '#06b6d4',
                        blue: '#3b82f6'
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Thmanyah Sans', sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease; 
        }
        h1, h2, h3, h4 { 
            font-family: 'Thmanyah Serif Display', serif; 
        }
        
        /* هنا تم تحديد خط Open Sans لنص السؤال فقط، بينما الخيارات تبقى بخط ثمانية */
        #question-text {
            font-family: 'Open Sans', sans-serif !important;
        }

        .option-btn { transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) {
            border-color: #06b6d4;
            background-color: rgba(6, 182, 212, 0.1);
            transform: translateX(-4px);
        }
        .filter-btn.active, .limit-btn.active {
            background: linear-gradient(to right, #06b6d4, #3b82f6) !important;
            color: white !important;
            border-color: transparent !important;
        }

        /* تنسيقات الوضع الفاتح (Light Mode) التلقائية */
        html:not(.dark) body { background-color: #f8fafc; color: #1e293b; }
        html:not(.dark) header, html:not(.dark) footer { background-color: rgba(255, 255, 255, 0.85); border-color: #e2e8f0; }
        html:not(.dark) .bg-card, html:not(.dark) .bg-card\/60, html:not(.dark) .bg-card\/40 { background-color: #ffffff; border-color: #cbd5e1; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        html:not(.dark) .bg-gray-900\/60, html:not(.dark) .bg-gray-900\/40 { background-color: #f8fafc; border-color: #cbd5e1; color: #1e293b; }
        html:not(.dark) .bg-gray-800, html:not(.dark) .bg-gray-800\/80, html:not(.dark) .bg-gray-800\/60 { background-color: #f1f5f9; border-color: #cbd5e1; color: #334155; }
        html:not(.dark) .text-white { color: #0f172a; }
        html:not(.dark) .text-gray-200, html:not(.dark) .text-gray-300 { color: #1e293b; }
        html:not(.dark) .text-gray-400, html:not(.dark) .text-gray-500, html:not(.dark) .text-gray-600 { color: #475569; }
        html:not(.dark) .border-gray-700, html:not(.dark) .border-gray-800, html:not(.dark) .border-gray-800\/80 { border-color: #e2e8f0; }
    </style>
</head>
<body class="bg-dark text-gray-200 min-h-screen flex flex-col justify-between relative overflow-x-hidden">

<!-- شريط علوي للعنوان ورابط الكويزات وتبديل المظهر -->
    <header class="bg-dark/70 backdrop-blur-md border-b border-gray-800 py-4 px-6 sticky top-0 z-50 transition-colors duration-300">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan to-blue">IT354 - Mock Exam</h1>
            
            <div class="flex items-center gap-3 md:gap-4">
                <!-- رابط الانتقال لصفحة تجميعات الكويزات -->
                <a href="it354-old-quizzes.html" class="bg-gradient-to-r from-cyan/20 to-blue/20 hover:from-cyan hover:to-blue text-cyan hover:text-white border border-cyan/40 text-xs md:text-sm font-bold px-3 md:px-4 py-1.5 rounded-full transition-all duration-300 flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-bolt"></i> تجميعات الكويزات
                </a>

                <!-- زر تبديل المظهر المنزلق -->
                <button id="theme-toggle" onclick="toggleTheme()" aria-label="تبديل المظهر" dir="ltr" class="relative w-16 h-8 rounded-full bg-slate-200 dark:bg-gray-800 border border-slate-300 dark:border-gray-700 flex items-center justify-between px-2 transition-colors duration-300 focus:outline-none shrink-0 cursor-pointer">
                    <i class="fa-solid fa-sun text-amber-500 text-xs"></i>
                    <i class="fa-solid fa-moon text-cyan text-xs"></i>
                    <span class="absolute top-1 left-1 w-6 h-6 rounded-full bg-white dark:bg-card border border-slate-200 dark:border-gray-600 shadow-md transform transition-transform duration-300 translate-x-0 dark:translate-x-8 flex items-center justify-center">
                        <i id="theme-icon" class="fa-solid fa-moon text-cyan text-xs"></i>
                    </span>
                </button>
            </div>
        </div>
    </header>

    <!-- حاوية الاختبار -->
    <main class="container mx-auto px-4 py-8 flex-grow flex flex-col items-center justify-center">
        
        <!-- لوحة التحكم: تصفية الفصول + تحديد عدد الأسئلة -->
        <div class="w-full max-w-3xl mb-6 space-y-4 bg-card/40 p-4 rounded-2xl border border-gray-800">
            <!-- أزرار الفصول -->
            <div class="flex flex-wrap items-center justify-center gap-2">
                <span class="text-xs text-gray-400 font-bold ml-2">الفصل:</span>
                <button onclick="filterChapter('ALL')" id="btn-ALL" class="filter-btn active text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">الكل (80)</button>
                <button onclick="filterChapter('Ch17')" id="btn-Ch17" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Ch 17 (16)</button>
                <button onclick="filterChapter('Ch18')" id="btn-Ch18" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Ch 18 (16)</button>
                <button onclick="filterChapter('Ch19')" id="btn-Ch19" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Ch 19 (16)</button>
                <button onclick="filterChapter('Ch20')" id="btn-Ch20" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Ch 20 (16)</button>
                <button onclick="filterChapter('Ch21')" id="btn-Ch21" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Ch 21 (16)</button>
            </div>

            <!-- أزرار عدد الأسئلة -->
            <div class="flex flex-wrap items-center justify-center gap-2 pt-2 border-t border-gray-800/80">
                <span class="text-xs text-gray-400 font-bold ml-2">عدد الأسئلة:</span>
                <button onclick="setQuestionLimit(20)" id="limit-20" class="limit-btn text-xs px-4 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">20 سؤال</button>
                <button onclick="setQuestionLimit(40)" id="limit-40" class="limit-btn text-xs px-4 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">40 سؤال</button>
                <button onclick="setQuestionLimit(60)" id="limit-60" class="limit-btn text-xs px-4 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">60 سؤال</button>
                <button onclick="setQuestionLimit(80)" id="limit-80" class="limit-btn active text-xs px-4 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">80 (الكل)</button>
            </div>
        </div>

        <div class="w-full max-w-3xl bg-card/60 backdrop-blur-md border border-gray-800 rounded-2xl p-6 md:p-8 shadow-xl">
            
            <!-- شاشة الأسئلة -->
            <div id="quiz-container">
                <!-- شريط التقدم والعداد -->
                <div class="flex flex-wrap justify-between items-center mb-3 text-sm text-gray-400 gap-2">
                    <div class="flex items-center gap-2">
                        <span id="question-counter" class="font-bold text-cyan">السؤال 1 من 80</span>
                        <span id="chapter-badge" class="bg-gray-800 text-gray-300 text-xs px-3 py-1 rounded-full border border-gray-700">Ch17</span>
                        <span id="status-badge" class="hidden text-xs px-2.5 py-0.5 rounded-full font-bold"></span>
                    </div>
            <div class="flex items-center gap-2 md:gap-3">
                        <span id="score-tracker" class="font-bold text-emerald-500 hidden sm:inline">الصحيحة: 0</span>
                        
                        <!-- زر خلط الأسئلة -->
                        <button onclick="shuffleCurrentPool()" title="خلط الأسئلة الحالية والبدء من جديد" class="text-gray-400 hover:text-cyan transition-colors text-xs bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700 flex items-center">
                            <i class="fa-solid fa-shuffle sm:ml-1"></i> <span class="hidden sm:inline">خلط</span>
                        </button>

                        <!-- زر الانتقال التلقائي (Toggle) -->
                        <button id="auto-next-toggle" onclick="toggleAutoNext()" title="انتقال تلقائي للسؤال التالي عند الإجابة الصحيحة" class="text-gray-400 hover:text-emerald-500 transition-colors text-xs bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700 flex items-center gap-1.5">
                            <i id="auto-next-icon" class="fa-solid fa-toggle-off text-gray-500 text-sm transition-all"></i> 
                            <span class="hidden sm:inline">تجاوز تلقائي</span>
                        </button>

                        <!-- زر الإبلاغ عبر تلجرام -->
                        <a id="report-btn" href="#" target="_blank" title="الإبلاغ عن خطأ في هذا السؤال عبر تلجرام" class="text-gray-400 hover:text-[#24A1DE] transition-colors text-xs bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700 flex items-center gap-1.5">
                            <i class="fa-brands fa-telegram text-[#24A1DE] text-sm"></i> <span class="hidden sm:inline">إبلاغ</span>
                        </a>
                    </div>
                </div>

                <div class="w-full bg-gray-800 h-2 rounded-full mb-8 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-cyan to-blue h-full transition-all duration-300" style="width: 1%"></div>
                </div>

                <!-- نص السؤال -->
                <h2 id="question-text" dir="ltr" class="text-lg md:text-2xl font-bold text-white mb-6 text-left leading-relaxed"></h2>

                <!-- الخيارات -->
                <div id="options-container" dir="ltr" class="space-y-3 text-left mb-6"></div>

                <!-- صندوق الشرح بعد الإجابة -->
                <div id="explanation-box" class="hidden p-4 rounded-xl bg-gray-800/80 border border-gray-700 text-sm text-gray-300 mb-6 leading-relaxed"></div>

                <!-- أزرار التنقل (السابق / التالي بدون إجبار على الإجابة / إنهاء) -->
                <div class="flex items-center justify-between gap-3 pt-4 border-t border-gray-800">
                    <button id="prev-btn" onclick="prevQuestion()" class="px-5 py-3 rounded-xl border border-gray-700 bg-gray-800/60 hover:border-cyan hover:text-cyan text-gray-300 font-bold transition-all disabled:opacity-40 disabled:pointer-events-none">
                        <i class="fa-solid fa-arrow-right ml-2"></i> السابق
                    </button>

                    <button onclick="showResults()" class="px-4 py-3 rounded-xl border border-gray-700 hover:border-rose-500/60 hover:text-rose-400 text-gray-400 text-sm font-bold transition-all">
                        إنهاء الاختبار
                    </button>

                    <button id="next-btn" onclick="nextQuestion()" class="flex-1 max-w-[220px] bg-gradient-to-r from-cyan to-blue hover:from-blue hover:to-cyan text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 shadow-lg">
                        التالي <i class="fa-solid fa-arrow-left mr-2"></i>
                    </button>
                </div>
            </div>

            <!-- شاشة النتيجة النهائية -->
            <div id="result-container" class="hidden text-center py-8">
                <div class="w-20 h-20 bg-cyan/20 rounded-full flex items-center justify-center mx-auto mb-6 text-cyan text-4xl">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h2 class="text-3xl font-bold text-white mb-3">انتهى الاختبار!</h2>
                <p id="final-score-text" class="text-xl text-gray-300 font-bold mb-2"></p>
                <p id="final-details-text" class="text-sm text-gray-400 mb-8"></p>
                
                <div class="flex flex-wrap justify-center gap-4">
                    <!-- زر إعادة الأسئلة الخاطئة فقط -->
                    <button id="retry-wrong-btn" onclick="retryWrongQuestions()" class="hidden bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 px-8 rounded-full shadow-[0_0_20px_rgba(225,29,72,0.4)] transition-all">
                        <i class="fa-solid fa-triangle-exclamation ml-2"></i> إعادة الأسئلة الخاطئة فقط (<span id="wrong-count-num">0</span>)
                    </button>

                    <button onclick="applyFilterAndLimit(false)" class="bg-gradient-to-r from-cyan to-blue text-white font-bold py-3 px-8 rounded-full hover:shadow-[0_0_20px_rgba(6,182,212,0.5)] transition-all">
                        <i class="fa-solid fa-rotate-right ml-2"></i> اختبار جديد
                    </button>

                    <button onclick="applyFilterAndLimit(true)" class="border border-cyan text-cyan hover:bg-cyan/10 font-bold py-3 px-8 rounded-full transition-all">
                        <i class="fa-solid fa-shuffle ml-2"></i> خلط والبدء من جديد
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center py-6 text-gray-600 text-sm border-t border-gray-800">
        Created by FZ &copy; 2026 
    </footer>

    <!-- برمجة الاختبار وقاعدة بيانات الـ 80 سؤال -->
    <script>
        // دالة تحديث ومزامنة المظهر بين الصفحات
        const themeIcon = document.getElementById('theme-icon');
        function updateThemeIcon() {
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.className = 'fa-solid fa-moon text-cyan text-xs';
            } else {
                themeIcon.className = 'fa-solid fa-sun text-amber-500 text-xs';
            }
        }
        updateThemeIcon();

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        const allQuestions = [
            // ================= CHAPTER 17 (16 Questions) =================
            {
                chapter: "Ch17",
                question: "1. What is the typical range of block sizes (B) on magnetic disks?",
                options: ["10 to 100 bytes", "512 to 4096 bytes", "1 to 10 Mbytes", "50 to 100 Kbytes"],
                correct: 1,
                explanation: "يتراوح حجم الكتلة (Block size B) النموذجي في الأقراص المغناطيسية بين 512 بايت و 4096 بايت، ويتم نقل الكتل بالكامل بين القرص والذاكرة الرئيسية."
            },
            {
                chapter: "Ch17",
                question: "2. A physical disk block (hardware) address consists of which three components?",
                options: [
                    "File name, record number, and field name",
                    "Cylinder number, track (or surface) number, and block number",
                    "Spindle speed, seek time, and latency",
                    "Sector angle, buffer ID, and cluster number"
                ],
                correct: 1,
                explanation: "يتكون العنوان الفيزيائي للكتلة على القرص من رقم الأسطوانة (Cylinder number)، ورقم المسار أو السطح (Track/Surface number)، ورقم الكتلة (Block number)."
            },
            {
                chapter: "Ch17",
                question: "3. Which technique is used to speed up the transfer of contiguous disk blocks by allowing continuous reading/writing?",
                options: ["Single indexing", "Double buffering", "Open addressing", "Spanned blocking"],
                correct: 1,
                explanation: "يُستخدم التخزين المؤقت المزدوج (Double buffering) لتسريع نقل الكتل المتجاورة بحيث يقوم المعالج بمعالجة كتلة بينما يتم قراءة الكتلة التالية من القرص."
            },
            {
                chapter: "Ch17",
                question: "4. What does the blocking factor (bfr) of a file represent?",
                options: [
                    "The number of blocks in a cylinder",
                    "The average number of file records stored in a single disk block",
                    "The number of empty bytes left in a block",
                    "The maximum number of tracks on a disk pack"
                ],
                correct: 1,
                explanation: "معامل التكتيل (Blocking factor - bfr) يمثل متوسط عدد السجلات المخزنة داخل كتلة واحدة (Block) على القرص."
            },
            {
                chapter: "Ch17",
                question: "5. When records exceed the size of a block or are allowed to be split across two or more blocks, the organization is called:",
                options: ["Unspanned records", "Spanned records", "Heap records", "Contiguous records"],
                correct: 1,
                explanation: "السجلات الممتدة (Spanned records) هي السجلات التي يمكن تخزين أجزاء منها في أكثر من كتلة واحدة لتجنب إهدار المساحة أو لأن حجمها أكبر من حجم الكتلة."
            },
            {
                chapter: "Ch17",
                question: "6. In a file of fixed-length records, which blocking type is usually used?",
                options: ["Spanned blocking", "Unspanned blocking", "Dynamic hashing", "Chained blocking"],
                correct: 1,
                explanation: "في الملفات ذات السجلات ثابتة الطول (Fixed-length records)، يُستخدم عادة التكتيل غير الممتد (Unspanned blocking) حيث لا ينقسم السجل بين كتلتين."
            },
            {
                chapter: "Ch17",
                question: "7. Which file operation removes the deleted records physically from the file or creates a new organization of the file records?",
                options: ["DELETE", "MODIFY", "REORGANIZE", "CLOSE"],
                correct: 2,
                explanation: "عملية DELETE تقوم عادة بوضع علامة حذف فقط، بينما عملية REORGANIZE تقوم بإزالة السجلات المحذوفة فعلياً وإعادة تنظيم الملف."
            },
            {
                chapter: "Ch17",
                question: "8. In an unordered file (Heap or Pile file), how are new records inserted and what is the average block access cost to search for a record in a file of 'b' blocks?",
                options: [
                    "Inserted in sorted order; average search cost is log2(b)",
                    "Inserted at the end of the file; average search cost is b/2",
                    "Inserted using a hash function; average search cost is 1",
                    "Inserted at the beginning of the file; average search cost is b"
                ],
                correct: 1,
                explanation: "في الملفات غير المرتبة (Heap files)، تُضاف السجلات الجديدة في نهاية الملف مما يجعل الإدخال سريعاً جداً، بينما يتطلب البحث مسحاً خطياً يكلف في المتوسط b/2 كتلة."
            },
            {
                chapter: "Ch17",
                question: "9. For an ordered (sequential) file of 'b' blocks, what is the average number of blocks accessed when using binary search on the ordering field?",
                options: ["b / 2", "b", "log2(b)", "b * log2(b)"],
                correct: 2,
                explanation: "البحث الثنائي (Binary search) على ملف مرتب مكون من b كتلة يتطلب الوصول إلى log2(b) كتلة في المتوسط."
            },
            {
                chapter: "Ch17",
                question: "10. Why do ordered files commonly maintain a separate unordered overflow (or transaction) file?",
                options: [
                    "To speed up binary search operations",
                    "To improve record insertion efficiency before periodically merging with the main file",
                    "To store backup copies in case of disk crash",
                    "To eliminate the need for primary keys"
                ],
                correct: 1,
                explanation: "الإدخال في الملف المرتب مكلف جداً لأنه يتطلب إزاحة السجلات؛ لذلك يُستخدم ملف فائض غير مرتب (Overflow file) لتسريع الإضافات الجديدة ثم يُدمج دورياً مع الملف الرئيسي."
            },
            {
                chapter: "Ch17",
                question: "11. Which collision resolution method in hashing checks subsequent positions in order from the occupied hash address until an empty position is found?",
                options: ["Chaining", "Multiple hashing", "Open addressing", "Extendible splitting"],
                correct: 2,
                explanation: "العنونة المفتوحة (Open addressing) تقوم بفحص المواقع التالية بالترتيب بدءاً من الموقع المشغول حتى تجد موقعاً فارغاً."
            },
            {
                chapter: "Ch17",
                question: "12. To reduce overflow records in static external hashing, what percentage of capacity is a hash file typically kept full, and what is its main disadvantage?",
                options: [
                    "50% full; cannot search on exact match",
                    "70-80% full; fixed number of buckets M does not adapt well if the file grows or shrinks",
                    "95-100% full; requires a binary tree directory",
                    "20-30% full; cannot handle numeric keys"
                ],
                correct: 1,
                explanation: "يُحفظ ملف التجزئة ممتلئاً بنسبة 70-80% لتقليل التصادمات، وأكبر عيوب التجزئة الثابتة أن عدد الدلاء (M) ثابت ولا يتكيف مع نمو أو تقلص حجم الملف، كما أن الوصول المرتب غير فعال."
            },
            {
                chapter: "Ch17",
                question: "13. How do Dynamic Hashing, Extendible Hashing, and Linear Hashing differ regarding directory structures and overflow areas?",
                options: [
                    "All three use a binary tree directory and require overflow areas",
                    "Dynamic uses a binary tree directory, Extendible uses a 2^d array directory (neither requires overflow), while Linear hashing uses no directory and requires an overflow area",
                    "Extendible hashing does not use a directory, whereas Linear hashing uses an array of size 2^d",
                    "Dynamic hashing splits blocks in linear order without a directory"
                ],
                correct: 1,
                explanation: "التجزئة الديناميكية تستخدم شجرة ثنائية، والقابلة للتوسع (Extendible) تستخدم مصفوفة بحجم 2^d (ولا يحتاجان لمنطقة فائض)، بينما التجزئة الخطية (Linear) لا تستخدم دليلاً وتحتاج لمنطقة فائض."
            },
            {
                chapter: "Ch17",
                question: "14. Which RAID level has NO redundant data, offering the best write performance at the risk of data loss?",

                explanation: "القابلية للتسلسل التضاربي (Conflict serializability) أكثر صرامة؛ فكل جدول قابل للتسلسل تضاربياً هو أيضاً قابل للتسلسل ظاهرياً (View serializable)، ولكن العكس غير صحيح عند وجود كتابات عمياء (Blind writes)."
            },
            {
                chapter: "Ch21",
                question: "78. In SQL2 transaction support, how does a transaction begin and end, and what is the default access mode when `READ UNCOMMITTED` isolation level is specified?",
                options: [
                    "Begins with an explicit BEGIN statement; default access mode is READ WRITE for all levels",
                    "Begins implicitly when particular SQL statements are encountered and ends explicitly with COMMIT or ROLLBACK; default access mode is READ WRITE unless isolation level is READ UNCOMMITTED (where READ ONLY is assumed)",
                    "Ends implicitly without COMMIT or ROLLBACK",
                    "Default isolation level is READ UNCOMMITTED"
                ],
                correct: 1,
                explanation: "في SQL لا توجد عبارة Begin صريحة بل تبدأ المعاملة ضمنياً وتنتهي صراحةً بـ COMMIT أو ROLLBACK. الوضع الافتراضي للوصول هو READ WRITE إلا إذا حُدد مستوى العزل READ UNCOMMITTED فيُفترض READ ONLY."
            },
            {
                chapter: "Ch21",
                question: "79. What are the four isolation levels specified in SQL2 `SET TRANSACTION`, and which one is the default?",
                options: [
                    "READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, and SERIALIZABLE (Default is SERIALIZABLE)",
                    "ACTIVE, PARTIAL, COMMITTED, and FAILED (Default is ACTIVE)",
                    "SHARED, EXCLUSIVE, BINARY, and CERTIFY",
                    "LOW, MEDIUM, HIGH, and STRICT"
                ],
                correct: 0,
                explanation: "مستويات العزل الأربعة في SQL هي: READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, و SERIALIZABLE (وهو المستوى الافتراضي والأعلى أماناً)."
            },
            {
                chapter: "Ch21",
                question: "80. What is the difference between a 'Nonrepeatable Read' and a 'Phantom' in lower SQL isolation levels?",
                options: [
                    "Nonrepeatable read: T1 reads an existing value, T2 updates it, and T1 reads the same item again seeing a different value; Phantom: T1 reads a set of rows based on a WHERE condition, T2 inserts a new row satisfying that condition, and T1 repeats the query seeing a new row that did not exist before",
                    "Nonrepeatable read involves inserting new rows; Phantom involves deleting tables",
                    "Both refer to hardware disk failures",
                    "Phantoms only occur at the SERIALIZABLE isolation level"
                ],
                correct: 0,
                explanation: "القراءة غير القابلة للتكرار (Nonrepeatable read) تحدث عندما تعدل معاملة أخرى قيمة سجل موجود بين قراءتين لنفس المعاملة، بينما الشبح (Phantom) يحدث عندما تضيف معاملة أخرى صفوفاً جديدة تحقق شرط WHERE فتظهر في القراءة الثانية."
            }
        ];

        let questions = [];
        let userAnswers = []; // لحفظ إجابة المستخدم لكل سؤال (null إذا لم يجب)
        let currentIdx = 0;
        let currentFilter = 'ALL';
        let currentLimit = 80;

        const questionCounter = document.getElementById('question-counter');
        const chapterBadge = document.getElementById('chapter-badge');
        const statusBadge = document.getElementById('status-badge');
        const scoreTracker = document.getElementById('score-tracker');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationBox = document.getElementById('explanation-box');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const finalScoreText = document.getElementById('final-score-text');
        const finalDetailsText = document.getElementById('final-details-text');
        const retryWrongBtn = document.getElementById('retry-wrong-btn');
        const wrongCountNum = document.getElementById('wrong-count-num');

        // اختيار الفصل
        function filterChapter(ch) {
            currentFilter = ch;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${ch}`).classList.add('active');
            applyFilterAndLimit(false);
        }

        // اختيار عدد الأسئلة (20, 40, 60, 80)
        function setQuestionLimit(limit) {
            currentLimit = limit;
            document.querySelectorAll('.limit-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`limit-${limit}`).classList.add('active');
            applyFilterAndLimit(true); // نقوم بخلط الأسئلة عند اختيار عدد فرعي لتنويع الاختبار
        }

        // تطبيق الفلتر والعدد المحدد
        function applyFilterAndLimit(shouldShuffle = false) {
            let pool = (currentFilter === 'ALL') 
                ? [...allQuestions] 
                : allQuestions.filter(q => q.chapter === currentFilter);

            if (shouldShuffle) {
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
            }

            questions = pool.slice(0, Math.min(currentLimit, pool.length));
            startQuizSession();
        }

        // خلط الأسئلة الحالية فقط
        function shuffleCurrentPool() {
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            startQuizSession();
        }

        // بدء جلسة الاختبار
        function startQuizSession() {
            currentIdx = 0;
            userAnswers = new Array(questions.length).fill(null);
            updateScoreTracker();
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            loadQuestion();
        }

        // حساب النقاط الحالية
        function getCurrentScore() {
            return userAnswers.reduce((acc, ans, idx) => {
                return acc + (ans === questions[idx].correct ? 1 : 0);
            }, 0);
        }

        function updateScoreTracker() {
            scoreTracker.innerText = `الصحيحة: ${getCurrentScore()}`;
        }

        // عرض السؤال الحالي (مع استرجاع حالة الإجابة إن وجدت)
        function loadQuestion() {
            const q = questions[currentIdx];
            const savedAnswer = userAnswers[currentIdx];

            questionCounter.innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            chapterBadge.innerText = q.chapter;
            progressBar.style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            questionText.innerText = q.question;
            const telegramUsername = "fahad_m7md"; // <-- استبدل هذه الكلمة بمعرفك في تلجرام بدون @
            const qNumMatch = q.question.match(/^\d+/);
            const qOriginalNum = qNumMatch ? qNumMatch[0] : (currentIdx + 1);
            const reportMessage = `IT354:\n- رقم السؤال الأصلي: (${qOriginalNum})\n- الفصل: (${q.chapter})\n- نص السؤال: "${q.question}"\n\nالملاحظة: `;
            document.getElementById('report-btn').href = `https://t.me/${telegramUsername}?text=${encodeURIComponent(reportMessage)}`;
            
            // تحديث حالة زر السابق والتالي
            prevBtn.disabled = (currentIdx === 0);
            nextBtn.innerHTML = (currentIdx === questions.length - 1) 
                ? `النتيجة النهائية <i class="fa-solid fa-flag-checkered mr-2"></i>` 
                : `التالي <i class="fa-solid fa-arrow-left mr-2"></i>`;

            optionsContainer.innerHTML = '';

            // شارة حالة السؤال (تمت الإجابة / متروك)
            if (savedAnswer === null) {
                statusBadge.className = "bg-gray-800 text-gray-400 text-xs px-2.5 py-0.5 rounded-full";
                statusBadge.innerText = "لم تتم الإجابة";
                statusBadge.classList.remove('hidden');
                explanationBox.classList.add('hidden');
            } else if (savedAnswer === q.correct) {
                statusBadge.className = "bg-emerald-500/20 text-emerald-500 text-xs px-2.5 py-0.5 rounded-full font-bold";
                statusBadge.innerText = "إجابة صحيحة";
                statusBadge.classList.remove('hidden');
            } else {
                statusBadge.className = "bg-rose-500/20 text-rose-500 text-xs px-2.5 py-0.5 rounded-full font-bold";
                statusBadge.innerText = "إجابة خاطئة";
                statusBadge.classList.remove('hidden');
            }

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                
                // إذا لم يُجب المستخدم بعد على هذا السؤال
                if (savedAnswer === null) {
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border border-gray-700 bg-gray-900/60 text-gray-200 font-medium flex justify-between items-center gap-3";
                    btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-500 shrink-0"></i>`;
                    btn.onclick = () => selectAnswer(index);
                } else {
                    // إذا كان قد أجاب مسبقاً، نعرض الإجابة المحفوظة والتصحيح
                    btn.disabled = true;
                    if (index === q.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-500/20 text-white font-bold flex justify-between items-center gap-3";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-check text-emerald-500 shrink-0"></i>`;
                    } else if (index === savedAnswer && savedAnswer !== q.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-500/20 text-white font-bold flex justify-between items-center gap-3";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-xmark text-rose-500 shrink-0"></i>`;
                    } else {
                        btn.className = "w-full text-left p-4 rounded-xl border border-gray-800 bg-gray-900/40 text-gray-500 font-medium flex justify-between items-center gap-3 opacity-60";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-600 shrink-0"></i>`;
                    }
                }
                optionsContainer.appendChild(btn);
            });

            if (savedAnswer !== null) {
                explanationBox.innerHTML = `<strong class="text-cyan">توضيح:</strong> ${q.explanation}`;
                explanationBox.classList.remove('hidden');
            }
        }

       // متغير لحفظ حالة زر الانتقال التلقائي
        let isAutoNext = false;

        // دالة تشغيل وإيقاف زر الانتقال التلقائي (Toggle)
        function toggleAutoNext() {
            isAutoNext = !isAutoNext;
            const icon = document.getElementById('auto-next-icon');
            const btn = document.getElementById('auto-next-toggle');
            if (isAutoNext) {
                icon.className = 'fa-solid fa-toggle-on text-emerald-500 text-sm transition-all';
                btn.classList.remove('text-gray-400');
                btn.classList.add('text-emerald-500');
            } else {
                icon.className = 'fa-solid fa-toggle-off text-gray-500 text-sm transition-all';
                btn.classList.remove('text-emerald-500');
                btn.classList.add('text-gray-400');
            }
        }

        // دالة اختيار الإجابة (محدثة بالانتقال الشبه فوري)
        function selectAnswer(selectedIdx) {
            userAnswers[currentIdx] = selectedIdx;
            updateScoreTracker();
            loadQuestion(); // يتم تلوين الإجابة الصحيحة بالأخضر هنا

            // إذا كان الزر مفعلاً والإجابة صحيحة، انتقل شبه فوراً
            if (isAutoNext && selectedIdx === questions[currentIdx].correct) {
                setTimeout(() => {
                    nextQuestion();
                }, 900); // 300 جزء من الثانية (شبه فوري)
            }
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            
            const finalScore = getCurrentScore();
            const total = questions.length;
            const percentage = Math.round((finalScore / total) * 100);
            
            // حساب الأسئلة الخاطئة والأسئلة المتروكة بدون إجابة
            let wrongOnlyCount = 0;
            let unansweredCount = 0;
            
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === null) {
                    unansweredCount++;
                } else if (userAnswers[idx] !== q.correct) {
                    wrongOnlyCount++;
                }
            });

            finalScoreText.innerText = `حصلت على ${finalScore} من ${total} (${percentage}%)`;
            finalDetailsText.innerText = `إجابات صحيحة: ${finalScore} | إجابات خاطئة: ${wrongOnlyCount} | لم تتم الإجابة: ${unansweredCount}`;

            // إظهار زر إعادة الأسئلة الخاطئة (أو غير المجاب عليها) إذا وُجدت
            const reviewPoolCount = wrongOnlyCount + unansweredCount;
            if (reviewPoolCount > 0) {
                wrongCountNum.innerText = reviewPoolCount;
                retryWrongBtn.classList.remove('hidden');
            } else {
                retryWrongBtn.classList.add('hidden');
            }
        }

        // إعادة اختبار الأسئلة الخاطئة (والمتروكة) فقط
        function retryWrongQuestions() {
            const wrongQuestions = questions.filter((q, idx) => userAnswers[idx] !== q.correct);
            if (wrongQuestions.length > 0) {
                questions = wrongQuestions;
                startQuizSession();
            }
        }

        // بدء الاختبار عند تحميل الصفحة
        applyFilterAndLimit(false);
    </script>
</body>
</html>
