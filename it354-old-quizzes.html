    <!-- 1. قراءة المظهر المحفوظ فور فتح الصفحة -->
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>

    <!-- 2. إعدادات Tailwind مع تفعيل darkMode: 'class' -->

<body class="bg-dark text-gray-200 min-h-screen flex flex-col justify-between relative overflow-x-hidden">

 <!-- شريط علوي للعنوان ورابط الاختبار الشامل وتبديل المظهر -->

            <div class="flex items-center gap-3 md:gap-4">

                <a href="it354-mock-exam.html" class="bg-gradient-to-r from-cyan/20 to-blue/20 hover:from-cyan hover:to-blue text-cyan hover:text-white border border-cyan/40 text-xs md:text-sm font-bold px-3 md:px-4 py-1.5 rounded-full transition-all duration-300 flex items-center gap-2 shadow-sm">

    <!-- حاوية الاختبار -->
    <main class="container mx-auto px-4 py-8 flex-grow flex flex-col items-center justify-center">
       <!-- صندوق التنبيه مع إغلاق تلقائي بعد 3 ثوانٍ -->
        <div id="quiz-alert" class="w-full max-w-3xl mb-4 bg-cyan/10 border border-cyan/30 rounded-xl p-3.5 px-4 flex items-center justify-between gap-3 text-xs md:text-sm text-gray-200 shadow-sm transition-all duration-500">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-circle-info text-cyan text-lg shrink-0"></i>
                <p class="leading-relaxed">
                    <strong class="text-cyan font-bold">تنبيه:</strong> تم تجميع أسئلة هذا الاختبار من كويزات سابقة للمقرر، وهي تغطي الوحدات الخمس الأولى (الفصول 17 إلى 21).
                </p>
            </div>
            <span id="alert-timer" class="text-cyan font-bold text-xs bg-cyan/20 px-2.5 py-1 rounded-full shrink-0">3s</span>
        </div>

        <script>
            (function() {
                let timeLeft = 3;
                const alertBox = document.getElementById('quiz-alert');
                const timerSpan = document.getElementById('alert-timer');
                const countdown = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        timerSpan.innerText = timeLeft + 's';
                    } else {
                        clearInterval(countdown);
                        alertBox.style.opacity = '0';
                        setTimeout(() => alertBox.style.display = 'none', 500);
                    }
                }, 1000);
            })();
        </script>
        <!-- لوحة التحكم: تصفية الفصول + تحديد عدد الأسئلة -->
        <div class="w-full max-w-3xl mb-6 space-y-4 bg-card/40 p-4 rounded-2xl border border-gray-800">
            <!-- أزرار الفصول -->
            <div class="flex flex-wrap items-center justify-center gap-2">
                <span class="text-xs text-gray-400 font-bold ml-2">الفصل:</span>
                <button onclick="filterChapter('ALL')" id="btn-ALL" class="filter-btn active text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">الكل (42)</button>
                <button onclick="filterChapter('Ch17')" id="btn-Ch17" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Ch 17 (12)</button>
                <button onclick="filterChapter('Ch18')" id="btn-Ch18" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Ch 18 (8)</button>
                <button onclick="filterChapter('Ch19')" id="btn-Ch19" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Ch 19 (8)</button>
                <button onclick="filterChapter('Ch20')" id="btn-Ch20" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Ch 20 (7)</button>
                <button onclick="filterChapter('Ch21')" id="btn-Ch21" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Ch 21 (7)</button>

            <!-- أزرار عدد الأسئلة -->

                <button onclick="setQuestionLimit(10)" id="limit-10" class="limit-btn text-xs px-4 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">10 أسئلة</button>
                <button onclick="setQuestionLimit(20)" id="limit-20" class="limit-btn text-xs px-4 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">20 سؤال</button>
                <button onclick="setQuestionLimit(30)" id="limit-30" class="limit-btn text-xs px-4 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">30 سؤال</button>
                <button onclick="setQuestionLimit(42)" id="limit-42" class="limit-btn active text-xs px-4 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">42 (الكل)</button>
            </div>
        </div>

        <div class="w-full max-w-3xl bg-card/60 backdrop-blur-md border border-gray-800 rounded-2xl p-6 md:p-8 shadow-xl">
            
            <!-- شاشة الأسئلة -->
            <div id="quiz-container">
                <!-- شريط التقدم والعداد -->
                <div class="flex flex-wrap justify-between items-center mb-3 text-sm text-gray-400 gap-2">
                    <div class="flex items-center gap-2">
                        <span id="question-counter" class="font-bold text-cyan">السؤال 1 من 42</span>
                        <span id="chapter-badge" class="bg-gray-800 text-gray-300 text-xs px-3 py-1 rounded-full border border-gray-700">Ch17</span>
                        <span id="status-badge" class="hidden text-xs px-2.5 py-0.5 rounded-full font-bold"></span>
                    </div>
                    <div class="flex items-center gap-2 md:gap-3">
                        <span id="score-tracker" class="font-bold text-emerald-500">الصحيحة: 0</span>
                        
                        <button onclick="shuffleCurrentPool()" title="خلط الأسئلة الحالية والبدء من جديد" class="text-gray-400 hover:text-cyan transition-colors text-xs bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">
                            <i class="fa-solid fa-shuffle ml-1"></i> خلط الأسئلة
                        </button>

                        <!-- زر الإبلاغ عبر تلجرام -->
                        <a id="report-btn" href="#" target="_blank" title="الإبلاغ عن خطأ في هذا السؤال عبر تلجرام" class="text-gray-400 hover:text-[#24A1DE] hover:border-[#24A1DE]/50 transition-colors text-xs bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700 flex items-center gap-1.5">
                            <i class="fa-brands fa-telegram text-[#24A1DE] text-sm"></i> إبلاغ عن خطأ
                        </a>
                    </div>
                </div>

                <div class="w-full bg-gray-800 h-2 rounded-full mb-8 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-cyan to-blue h-full transition-all duration-300" style="width: 2%"></div>
                </div>

                <!-- نص السؤال -->
                <h2 id="question-text" dir="ltr" class="text-lg md:text-2xl font-bold text-white mb-6 text-left leading-relaxed whitespace-pre-line"></h2>

                <!-- الخيارات -->
                <div id="options-container" dir="ltr" class="space-y-3 text-left mb-6"></div>

                <!-- صندوق الشرح بعد الإجابة -->
                <div id="explanation-box" class="hidden p-4 rounded-xl bg-gray-800/80 border border-gray-700 text-sm text-gray-300 mb-6 leading-relaxed"></div>

                <!-- أزرار التنقل -->
                <div class="flex items-center justify-between gap-3 pt-4 border-t border-gray-800">
                    <button id="prev-btn" onclick="prevQuestion()" class="px-5 py-3 rounded-xl border border-gray-700 bg-gray-800/60 hover:border-cyan hover:text-cyan text-gray-300 font-bold transition-all disabled:opacity-40 disabled:pointer-events-none">
                        <i class="fa-solid fa-arrow-right ml-2"></i> السابق
                    </button>

                    <button onclick="showResults()" class="px-4 py-3 rounded-xl border border-gray-700 hover:border-rose-500/60 hover:text-rose-400 text-gray-400 text-sm font-bold transition-all">
                        إنهاء الاختبار
                    </button>

                    <button id="next-btn" onclick="nextQuestion()" class="flex-1 max-w-[220px] bg-gradient-to-r from-cyan to-blue hover:from-blue hover:to-cyan text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 shadow-lg">
                        التالي <i class="fa-solid fa-arrow-left mr-2"></i>
                    </button>
                </div>
            </div>

            <!-- شاشة النتيجة النهائية -->
            <div id="result-container" class="hidden text-center py-8">
                <div class="w-20 h-20 bg-cyan/20 rounded-full flex items-center justify-center mx-auto mb-6 text-cyan text-4xl">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h2 class="text-3xl font-bold text-white mb-3">انتهى الاختبار!</h2>
                <p id="final-score-text" class="text-xl text-gray-300 font-bold mb-2"></p>
                <p id="final-details-text" class="text-sm text-gray-400 mb-8"></p>
                
                <div class="flex flex-wrap justify-center gap-4">
                    <button id="retry-wrong-btn" onclick="retryWrongQuestions()" class="hidden bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 px-8 rounded-full shadow-[0_0_20px_rgba(225,29,72,0.4)] transition-all">
                        <i class="fa-solid fa-triangle-exclamation ml-2"></i> إعادة الأسئلة الخاطئة فقط (<span id="wrong-count-num">0</span>)
                    </button>

                    <button onclick="applyFilterAndLimit(false)" class="bg-gradient-to-r from-cyan to-blue text-white font-bold py-3 px-8 rounded-full hover:shadow-[0_0_20px_rgba(6,182,212,0.5)] transition-all">
                        <i class="fa-solid fa-rotate-right ml-2"></i> اختبار جديد
                    </button>

                    <button onclick="applyFilterAndLimit(true)" class="border border-cyan text-cyan hover:bg-cyan/10 font-bold py-3 px-8 rounded-full transition-all">
                        <i class="fa-solid fa-shuffle ml-2"></i> خلط والبدء من جديد

        </div>

    <footer class="text-center py-6 text-gray-600 text-sm border-t border-gray-800">

    </footer>

    <!-- برمجة الاختبار وقاعدة بيانات أسئلة الكويزات (Ch 17 - 21) -->
    <script>
        const themeIcon = document.getElementById('theme-icon');
        function updateThemeIcon() {
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.className = 'fa-solid fa-moon text-cyan text-xs';
            } else {
                themeIcon.className = 'fa-solid fa-sun text-amber-500 text-xs';
            }
        }
        updateThemeIcon();

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        const allQuestions = [
            // ================= CHAPTER 17 (12 Questions) =================
            {
                chapter: "Ch17",
                question: "1. Hard disk drive (HDD) is a ________ storage device known for high storage capacity and low cost.",
                options: ["Primary", "Temporary", "Volatile", "Secondary"],
                correct: 3,
                explanation: "الأقراص الصلبة (HDD) تُعد من وسائل التخزين الثانوية (Secondary storage) وتتميز بالسعة العالية والتكلفة المنخفضة."
            },
            {
                chapter: "Ch17",
                question: "2. Where is data permanently stored in a computer system?",
                options: ["In RAM (main memory)", "On the hard disk", "In the keyboard", "In the CPU"],
                correct: 1,
                explanation: "يتم تخزين البيانات بشكل دائم (غير متطاير) على القرص الصلب (Hard disk)، بينما الذاكرة العشوائية RAM مؤقتة."
            },
            {
                chapter: "Ch17",
                question: "3. ________ contains several magnetic disks connected to a rotating spindle.",
                options: ["Disk track", "Disk block", "Disk pack", "Disk surface"],
                correct: 2,
                explanation: "حزمة الأقراص (Disk pack) تتكون من عدة أقراص مغناطيسية متصلة بمحور دوران مشترك (Rotating spindle)."
            },
            {
                chapter: "Ch17",
                question: "4. What does a physical disk block address consist of?",
                options: [
                    "Cylinder number, track number, and block number",
                    "Disk size, block number, and rotational delay",
                    "Sector number, block size, and data length",
                    "Track number, buffer size, and read-write speed"
                ],
                correct: 0,
                explanation: "يتكون عنوان الكتلة الفيزيائي على القرص من رقم الأسطوانة (Cylinder number)، ورقم المسار (Track number)، ورقم الكتلة (Block number)."
            },
            {
                chapter: "Ch17",
                question: "5. What is the primary reason disk access is considered time-consuming compared to main memory access?",
                options: [
                    "The disk uses binary encoding instead of hex",
                    "Disk blocks are larger than memory pages",
                    "The seek time and rotational delay required to position the read-write head",
                    "The disk has less storage capacity"
                ],
                correct: 2,
                explanation: "الوصول للقرص يستغرق وقتاً طويلاً مقارنة بالذاكرة الرئيسية بسبب الحركة الميكانيكية المتمثلة في زمن البحث (Seek time) وتأخير الدوران (Rotational delay)."
            },
            {
                chapter: "Ch17",
                question: "6. Which one record is divided into segments and accommodated in two or more consecutive blocks?",
                options: ["Descriptor Record", "Sparse Record", "Spanned Record", "Nondense Record"],
                correct: 2,
                explanation: "السجل الممتد (Spanned Record) هو السجل الذي يتجاوز حجم المساحة المتبقية في الكتلة فينقسم ليُخزن في كتلتين أو أكثر."
            },
            {
                chapter: "Ch17",
                question: "7. Record insertion is quite efficient in ________ files.",
                options: ["Ordered & Unordered", "Ordered", "Unordered", "Sequential"],
                correct: 2,
                explanation: "إدخال السجلات الجديدة سريع وفعال جداً في الملفات غير المرتبة (Unordered / Heap files) لأن السجل يُضاف مباشرة في نهاية الملف."
            },
            {
                chapter: "Ch17",
                question: "8. Which file type is the best choice when you insert new records very frequently?",
                options: ["Hashed file", "Ordered (sorted) file", "Heap (unordered) file", "Indexed file"],
                correct: 2,
                explanation: "ملف الكومة غير المرتب (Heap / Unordered file) هو الخيار الأفضل عند كثرة عمليات الإضافة لأن الإدخال يتم في آخر كتلة دون الحاجة لإعادة الترتيب."
            },
            {
                chapter: "Ch17",
                question: "9. Which file organization uses a separate 'overflow' file to handle new insertions efficiently while maintaining order?",
                options: ["Ordered (sequential) file", "Hashed file", "RAID array", "Heap file"],
                correct: 0,
                explanation: "الملف المرتب (Ordered/Sequential file) يستخدم ملف فائض مؤقت (Overflow/Transaction file) لتسريع عمليات الإدخال الجديدة ثم يدمجه دورياً."
            },
            {
                chapter: "Ch17",
                question: "10. Which one shows that the program uses a second hash function if the first one fails. If another collision occurs, the program employs a third hash function and then uses open addressing?",
                options: ["Multiple hashing", "Natural hashing", "Single hashing", "Linear hashing"],
                correct: 0,
                explanation: "التجزئة المتعددة (Multiple hashing) تطبق دالة تجزئة ثانية عند حدوث تصادم، ثم ثالثة إذا لزم الأمر قبل اللجوء للعنونة المفتوحة."
            },
            {
                chapter: "Ch17",
                question: "11. The directory in extendible hashing is an array of size 2^d, where d is known as the ________.",
                options: ["natural depth", "folder depth", "linear depth", "global depth"],
                correct: 3,
                explanation: "في التجزئة القابلة للتوسع (Extendible hashing)، يكون الدليل مصفوفة بحجم 2^d حيث يُسمى d بالعمق الشامل (Global depth)."
            },
            {
                chapter: "Ch17",
                question: "12. In RAID Technology, ________ distributes data transparently over multiple disks to make them appear as a single large, fast disk.",
                options: ["Drive descriptor", "Multiple hashing", "Data striping", "Sparse record"],
                correct: 2,
                explanation: "تقنية تشريح/توزيع البيانات (Data striping) في RAID توزع البيانات بشفافية عبر عدة أقراص لتبدو كقرص منطقي واحد كبير وسريع."
            },

            // ================= CHAPTER 18 (8 Questions) =================
            {
                chapter: "Ch18",
                question: "13. A ________ is specified on the ordering key field of an ordered file of records.",
                options: ["clustering index", "primary index", "secondary (key) index", "secondary (nonkey) index"],
                correct: 1,
                explanation: "الفهرس الأساسي (Primary index) يُعرّف على حقل مفتاح الترتيب (Ordering key field) لملف بيانات مرتب فيزيائياً."
            },
            {
                chapter: "Ch18",
                question: "14. Which of the following best describes a Primary Index?",
                options: [
                    "An index built on any column you choose",
                    "An index used only for text searches",
                    "An index built on the column that the file is already sorted by",
                    "An index that stores every single record"
                ],
                correct: 2,
                explanation: "الفهرس الأساسي يُبنى على العمود (المفتاحي) الذي يكون ملف البيانات مرتباً على أساسه مسبقاً."
            },
            {
                chapter: "Ch18",
                question: "15. A ________ has an index entry for every search key value (and hence every record) in the data file.",
                options: ["nondense index", "dense index", "primary index", "sparse index"],
                correct: 1,
                explanation: "الفهرس الكثيف (Dense index) يحتوي على مدخل فهرس لكل قيمة مفتاح بحث (وبالتالي لكل سجل) في ملف البيانات."
            },
            {
                chapter: "Ch18",
                question: "16. The index whose search key specifies an order different from the sequential order of the file is called ________ index.",
                options: ["Secondary", "Clustering", "Primary", "Primary and Clustering"],
                correct: 0,
                explanation: "الفهرس الثانوي (Secondary index) يُبنى على حقل غير مرتب، لذا فإن ترتيبه يختلف عن الترتيب التسلسلي الفيزيائي للملف."

        function applyFilterAndLimit(shouldShuffle = false) {
            let pool = (currentFilter === 'ALL') 
                ? [...allQuestions] 
                : allQuestions.filter(q => q.chapter === currentFilter);

            if (shouldShuffle) {
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
            }

            questions = pool.slice(0, Math.min(currentLimit, pool.length));
            startQuizSession();
        }

        function shuffleCurrentPool() {
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            startQuizSession();
        }

        }

        function getCurrentScore() {
            return userAnswers.reduce((acc, ans, idx) => {
                return acc + (ans === questions[idx].correct ? 1 : 0);
            }, 0);
        }

        function updateScoreTracker() {
            scoreTracker.innerText = `الصحيحة: ${getCurrentScore()}`;
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            const savedAnswer = userAnswers[currentIdx];

            questionCounter.innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            chapterBadge.innerText = q.chapter;
            progressBar.style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            questionText.innerText = q.question;

            // تجهيز رابط الإبلاغ على تلجرام تلقائياً
            const telegramUsername = "fahad_m7md"; // <-- استبدل بمعرف التلجرام الخاص بك بدون @
            const qNumMatch = q.question.match(/^\d+/);
            const qOriginalNum = qNumMatch ? qNumMatch[0] : (currentIdx + 1);
            const reportMessage = `\n- رقم السؤال: (${qOriginalNum})\n- الفصل: (${q.chapter})\n- السؤال: "${q.question}"\n\nالملاحظة: `;
            document.getElementById('report-btn').href = `https://t.me/${telegramUsername}?text=${encodeURIComponent(reportMessage)}`;
            
            prevBtn.disabled = (currentIdx === 0);
            nextBtn.innerHTML = (currentIdx === questions.length - 1) 
                ? `النتيجة النهائية <i class="fa-solid fa-flag-checkered mr-2"></i>` 
                : `التالي <i class="fa-solid fa-arrow-left mr-2"></i>`;

            optionsContainer.innerHTML = '';

            if (savedAnswer === null) {
                statusBadge.className = "bg-gray-800 text-gray-400 text-xs px-2.5 py-0.5 rounded-full";
                statusBadge.innerText = "لم تتم الإجابة";
                statusBadge.classList.remove('hidden');
                explanationBox.classList.add('hidden');
            } else if (savedAnswer === q.correct) {
                statusBadge.className = "bg-emerald-500/20 text-emerald-500 text-xs px-2.5 py-0.5 rounded-full font-bold";
                statusBadge.innerText = "إجابة صحيحة";
                statusBadge.classList.remove('hidden');
            } else {
                statusBadge.className = "bg-rose-500/20 text-rose-500 text-xs px-2.5 py-0.5 rounded-full font-bold";
                statusBadge.innerText = "إجابة خاطئة";
                statusBadge.classList.remove('hidden');
            }

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                
                if (savedAnswer === null) {
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border border-gray-700 bg-gray-900/60 text-gray-200 font-medium flex justify-between items-center gap-3";
                    btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-500 shrink-0"></i>`;
                    btn.onclick = () => selectAnswer(index);
                } else {
                    btn.disabled = true;
                    if (index === q.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-500/20 text-white font-bold flex justify-between items-center gap-3";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-check text-emerald-500 shrink-0"></i>`;
                    } else if (index === savedAnswer && savedAnswer !== q.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-500/20 text-white font-bold flex justify-between items-center gap-3";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-xmark text-rose-500 shrink-0"></i>`;
                    } else {
                        btn.className = "w-full text-left p-4 rounded-xl border border-gray-800 bg-gray-900/40 text-gray-500 font-medium flex justify-between items-center gap-3 opacity-60";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-600 shrink-0"></i>`;
                    }
                }
                optionsContainer.appendChild(btn);
            });

            if (savedAnswer !== null) {
                explanationBox.innerHTML = `<strong class="text-cyan">توضيح:</strong> ${q.explanation}`;
                explanationBox.classList.remove('hidden');
            }
        }

        function selectAnswer(selectedIdx) {
            userAnswers[currentIdx] = selectedIdx;
            updateScoreTracker();
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            
            const finalScore = getCurrentScore();
            const total = questions.length;
            const percentage = Math.round((finalScore / total) * 100);
            
            let wrongOnlyCount = 0;
            let unansweredCount = 0;
            
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === null) {
                    unansweredCount++;
                } else if (userAnswers[idx] !== q.correct) {
                    wrongOnlyCount++;
                }
            });

            finalScoreText.innerText = `حصلت على ${finalScore} من ${total} (${percentage}%)`;
            finalDetailsText.innerText = `إجابات صحيحة: ${finalScore} | إجابات خاطئة: ${wrongOnlyCount} | لم تتم الإجابة: ${unansweredCount}`;

            const reviewPoolCount = wrongOnlyCount + unansweredCount;
            if (reviewPoolCount > 0) {
                wrongCountNum.innerText = reviewPoolCount;
                retryWrongBtn.classList.remove('hidden');
            } else {
                retryWrongBtn.classList.add('hidden');
            }
        }

        function retryWrongQuestions() {
            const wrongQuestions = questions.filter((q, idx) => userAnswers[idx] !== q.correct);
            if (wrongQuestions.length > 0) {
                questions = wrongQuestions;
                startQuizSession();
            }
        }

        applyFilterAndLimit(false);
    </script>
</body>
</html>
