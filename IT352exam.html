                    </button>

                        إنهاء الاختبار
                    </button>
                    <button id="next-btn" onclick="nextQuestion()" class="flex-1 max-w-[220px] bg-gradient-to-r from-primary to-secondary text-white font-bold py-3 px-6 rounded-full transition-all">
                        التالي <i class="fa-solid fa-arrow-left mr-2"></i>
                    </button>

            <div id="result-container" class="hidden text-center py-8">
                <div class="w-20 h-20 bg-primary/20 rounded-full flex items-center justify-center mx-auto mb-6 text-primary text-4xl">

                </div>

                <p id="final-score-text" class="text-xl text-gray-300 font-bold mb-2"></p>
                <p id="final-details-text" class="text-sm text-gray-400 mb-8"></p>
                <div class="flex flex-wrap justify-center gap-4">
                    <button id="retry-wrong-btn" onclick="retryWrongQuestions()" class="hidden bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 px-8 rounded-full transition-all">
                        <i class="fa-solid fa-triangle-exclamation ml-2"></i> إعادة الخاطئة (<span id="wrong-count-num"></span>)
                    </button>
                    <button onclick="applyFilterAndLimit(false)" class="bg-gradient-to-r from-primary to-secondary text-white font-bold py-3 px-8 rounded-full transition-all">

    </main>

    <script>
        function updateThemeIcon() {
            const icon = document.getElementById('theme-icon');
            if (document.documentElement.classList.contains('dark')) {
                icon.className = 'fa-solid fa-moon text-primary text-xs';
            } else {
                icon.className = 'fa-solid fa-sun text-amber-500 text-xs';
            }
        }
        updateThemeIcon();
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            updateThemeIcon();
        }

        const allQuestions = [
            // ================= MODULE 1 (20 Qs) =================
            { chapter: "Mod1", question: "What is Interaction Design according to Sharp, Rogers, and Preece (2019)?", options: ["The design of spaces for human communication and interaction.", "Designing interactive products to support the way people communicate and interact in their everyday and working lives.", "Focusing exclusively on hardware development.", "Creating graphic designs for physical products."], correct: 1, explanation: "حسب المرجع[cite: 2325]، تعريف تصميم التفاعل هو تصميم منتجات تفاعلية تدعم طريقة تواصل الأشخاص وتفاعلهم في حياتهم اليومية." },
            { chapter: "Mod1", question: "According to Winograd (1997), Interaction Design is defined as:", options: ["The design of spaces for human communication and interaction.", "Designing systems for data processing.", "Designing logical frameworks.", "Developing efficient back-end algorithms."], correct: 0, explanation: "عرف Winograd تصميم التفاعل بأنه تصميم المساحات للتواصل والتفاعل البشري[cite: 2325]." },
            { chapter: "Mod1", question: "What does 'Usability' mean in the context of Interaction Design?", options: ["It means the system is completely free of bugs.", "It means the system is complex and feature-rich.", "It means the system is easy to learn, effective to use, and provides an enjoyable experience.", "It refers to the manufacturing cost of a product."], correct: 2, explanation: "قابلية الاستخدام (Usability) تعني أن يكون النظام سهل التعلم، فعال في الاستخدام، ويوفر تجربة ممتعة[cite: 2325]." },
            { chapter: "Mod1", question: "Which of the following is considered an 'Academic Discipline' contributing to Interaction Design?", options: ["Graphic Design", "Film Industry", "Product Design", "Ergonomics"], correct: 3, explanation: "يعتبر علم وبيئة العمل (Ergonomics) من التخصصات الأكاديمية (Academic Disciplines) التي تساهم في تصميم التفاعل[cite: 2327, 2328]." },
            { chapter: "Mod1", question: "Which of the following is considered a 'Design Practice' in Interaction Design?", options: ["Industrial Design", "Psychology", "Computer Science", "Informatics"], correct: 0, explanation: "يعتبر التصميم الصناعي (Industrial Design) من ممارسات التصميم (Design Practices) في مجال تفاعل الإنسان والحاسوب[cite: 2327, 2329]." },
            { chapter: "Mod1", question: "What is a 'Pro' of involving people from different backgrounds in Interaction Design?", options: ["It reduces the overall budget.", "It speeds up the coding process.", "More ideas and designs are generated.", "It eliminates the need for user testing."], correct: 2, explanation: "من الإيجابيات (Pros) إشراك أشخاص بخلفيات مختلفة هو توليد المزيد من الأفكار والتصاميم[cite: 2330]." },
            { chapter: "Mod1", question: "What is a 'Con' of involving people from different backgrounds in Interaction Design?", options: ["Fewer ideas are generated.", "It is difficult to communicate and progress forward the designs being created.", "It makes the system overly simple.", "It restricts the use of multimedia."], correct: 1, explanation: "من السلبيات (Cons) وجود صعوبة في التواصل والمضي قدماً بالتصاميم نتيجة لاختلاف وجهات النظر[cite: 2330]." },
            { chapter: "Mod1", question: "According to Nielsen and Norman (2014), the User Experience (UX) is:", options: ["Only the aesthetic appeal of a product.", "All aspects of the end-user's interaction with the company, its services, and its products.", "The technical specifications of the product.", "The marketing strategy used to sell the product."], correct: 1, explanation: "تجربة المستخدم تشمل جميع جوانب تفاعل المستخدم النهائي مع الشركة وخدماتها ومنتجاتها[cite: 2332]." },
            { chapter: "Mod1", question: "The success of the iPod phenomenon demonstrated that:", options: ["Quality of the overall user experience is more important than just technical features.", "Pricing is the only factor that matters.", "Touchscreens are unnecessary.", "Users do not care about aesthetics."], correct: 0, explanation: "نجاح أجهزة iPod أثبت أن جودة تجربة المستخدم الإجمالية كانت العامل الحاسم للنجاح[cite: 2333]." },
            { chapter: "Mod1", question: "Which of the following is an essential aspect of Interaction Design?", options: ["Avoiding user involvement to save time.", "Using a strictly linear process without iterations.", "Identification and specification of usability and user experience goals.", "Keeping the conceptual model a secret from users."], correct: 2, explanation: "من الجوانب الأساسية في تصميم التفاعل هو تحديد وتخصيص أهداف قابلية الاستخدام وتجربة المستخدم[cite: 2334]." },
            { chapter: "Mod1", question: "The extent to which an interactive product is accessible by as many people as possible is defined as:", options: ["Usability", "Accessibility", "Inclusiveness", "Effectiveness"], correct: 1, explanation: "إمكانية الوصول (Accessibility) تُعرف بأنها مدى إمكانية استخدام المنتج من قبل أكبر عدد ممكن من الناس، خاصة ذوي الإعاقة[cite: 2337]." },
            { chapter: "Mod1", question: "Making products and services that accommodate the widest possible number of people (regardless of disability, education, age) defines:", options: ["Efficiency", "Accessibility", "Inclusiveness", "Utility"], correct: 2, explanation: "الشمولية (Inclusiveness) تعني صنع منتجات وخدمات تستوعب وتلائم أوسع نطاق ممكن من الأشخاص[cite: 2338]." },
            { chapter: "Mod1", question: "Which usability goal asks: 'Is the product capable of allowing people to learn, carry out their work efficiently, access the information that they need?'", options: ["Effectiveness", "Efficiency", "Safety", "Memorability"], correct: 0, explanation: "الفعالية (Effectiveness) تقيس قدرة المنتج على السماح للأشخاص بإنجاز عملهم والوصول لما يحتاجونه[cite: 2341]." },
            { chapter: "Mod1", question: "Which usability goal focuses on sustaining a high level of productivity once users have learned how to use a product?", options: ["Effectiveness", "Safety", "Efficiency", "Learnability"], correct: 2, explanation: "الكفاءة (Efficiency) تركز على الحفاظ على مستوى عالٍ من الإنتاجية بعد أن يتعلم المستخدم كيفية استخدام النظام[cite: 2341]." },
            { chapter: "Mod1", question: "Which usability goal is concerned with the range of errors that are possible using the product and the measures to permit users to recover easily?", options: ["Safety", "Utility", "Effectiveness", "Efficiency"], correct: 0, explanation: "الأمان (Safety) يتعلق بمدى الأخطاء المحتملة والتدابير المتاحة للمستخدمين للتعافي منها بسهولة[cite: 2341]." },
            { chapter: "Mod1", question: "Which of the following is considered an UNDESIRABLE aspect of User Experience Goals?", options: ["Satisfying", "Engaging", "Patronizing", "Provocative"], correct: 2, explanation: "يعتبر الشعور بالتعالي أو التنازل (Patronizing) من الجوانب غير المرغوبة (Undesirable aspects) في تجربة المستخدم[cite: 2342]." },
            { chapter: "Mod1", question: "Which of the following is considered a DESIRABLE aspect of User Experience Goals?", options: ["Boring", "Frustrating", "Cognitively stimulating", "Gimmicky"], correct: 2, explanation: "يعتبر التحفيز المعرفي (Cognitively stimulating) من الجوانب المرغوبة في تجربة المستخدم[cite: 2342]." },
            { chapter: "Mod1", question: "Sending information back to the user about what has been done (e.g., sound, highlighting, animation) is known as:", options: ["Visibility", "Feedback", "Consistency", "Affordance"], correct: 1, explanation: "التغذية الراجعة (Feedback) هي إرسال معلومات للمستخدم حول الإجراء الذي تم، مثل الصوت أو التظليل[cite: 2344]." },
            { chapter: "Mod1", question: "Designing operations to act the same within an application is the definition of:", options: ["External consistency", "Internal consistency", "Feedback", "Learnability"], correct: 1, explanation: "التناسق الداخلي (Internal consistency) يعني تصميم العمليات لتعمل بنفس الطريقة داخل نفس التطبيق[cite: 2345]." },
            { chapter: "Mod1", question: "Designing the same operations and interfaces across different applications and devices is the definition of:", options: ["Internal consistency", "External consistency", "Safety", "Utility"], correct: 1, explanation: "التناسق الخارجي (External consistency) هو توحيد العمليات والواجهات عبر تطبيقات وأجهزة متعددة[cite: 2345]." },

            // ================= MODULE 2 (20 Qs) =================
            { chapter: "Mod2", question: "Which of the following is NOT one of the four basic activities of Interaction Design?", options: ["Discovering requirements", "Designing alternatives", "Prototyping alternative designs", "Writing back-end algorithms"], correct: 3, explanation: "الأنشطة الأربعة هي: اكتشاف المتطلبات، تصميم البدائل، النمذجة، والتقييم. كتابة خوارزميات الباك-إند ليست من الأنشطة الأساسية لتصميم التفاعل[cite: 2375]." },
            { chapter: "Mod2", question: "The double diamond of design approach consists of four phases. Which phase involves gathering insights about the problem?", options: ["Define", "Discover", "Develop", "Deliver"], correct: 1, explanation: "مرحلة الاكتشاف (Discover) تهدف لجمع رؤى حول المشكلة[cite: 2357]." },
            { chapter: "Mod2", question: "In the double diamond of design approach, which phase involves developing a clear brief that frames the design challenge?", options: ["Discover", "Define", "Develop", "Deliver"], correct: 1, explanation: "مرحلة التحديد (Define) تهدف لوضع ملخص واضح يؤطر التحدي التصميمي[cite: 2357]." },
            { chapter: "Mod2", question: "In the double diamond of design approach, which phase involves creating, prototyping, testing, and iterating solutions?", options: ["Discover", "Define", "Develop", "Deliver"], correct: 2, explanation: "مرحلة التطوير (Develop) يتم فيها إنشاء الحلول ونمذجتها واختبارها[cite: 2357]." },
            { chapter: "Mod2", question: "Which degree of user involvement requires constant input but may cause users to lose touch with other users?", options: ["Part time", "Short term", "Full time", "Long term"], correct: 3, explanation: "المشاركة طويلة الأمد (Long term) توفر مدخلات مستمرة ولكن قد تجعل المستخدم يفقد التواصل مع المستخدمين الآخرين[cite: 2372]." },
            { chapter: "Mod2", question: "Which of the following describes 'Part time' user involvement?", options: ["Consistent across project life.", "Constant input but lose touch with users.", "Patchy input, and very stressful.", "Virtual contributions from thousands of users."], correct: 2, explanation: "المشاركة بدوام جزئي (Part time) تتميز بمدخلات متقطعة (Patchy input) وقد تكون مرهقة جداً[cite: 2372]." },
            { chapter: "Mod2", question: "A user-centered approach is based on all of the following EXCEPT:", options: ["Early focus on users and tasks.", "Empirical measurement.", "Iterative design.", "Focusing only on the system's technical requirements."], correct: 3, explanation: "النهج المتمركز حول المستخدم يرتكز على التركيز المبكر على المستخدم، القياس التجريبي، والتصميم التكراري، ولا يقتصر على المتطلبات التقنية فقط[cite: 2373]." },
            { chapter: "Mod2", question: "According to the user-centered approach, what does 'Empirical measurement' mean?", options: ["Designing algorithms using empirical formulas.", "Users' reactions and performance to scenarios, simulations, and prototypes are observed, recorded, and analyzed.", "Measuring the physical dimensions of the interface.", "Estimating the budget required for the project."], correct: 1, explanation: "القياس التجريبي (Empirical measurement) يعني ملاحظة وتسجيل وتحليل أداء وردود أفعال المستخدمين تجاه النماذج الأولية[cite: 2373]." },
            { chapter: "Mod2", question: "In Interaction Design activities, 'Discovering requirements' involves:", options: ["Understanding the target users and the support an interactive product could usefully provide.", "Producing the final code of the product.", "Selling the product to the target users.", "Evaluating the completed product in the market."], correct: 0, explanation: "اكتشاف المتطلبات يركز على فهم المستخدمين المستهدفين والدعم الذي يمكن أن يقدمه المنتج التفاعلي[cite: 2376]." },
            { chapter: "Mod2", question: "What does 'Conceptual design' involve?", options: ["Considering the detail of the product including colors, sounds, and images.", "Producing the conceptual model describing an abstraction outlining what people can do with a product.", "Writing the user manual.", "Testing the prototype with actual users."], correct: 1, explanation: "التصميم المفاهيمي (Conceptual design) هو إنتاج نموذج يصف بشكل مجرد ما يمكن للمستخدمين فعله بالمنتج[cite: 2377]." },
            { chapter: "Mod2", question: "What does 'Concrete design' consider?", options: ["The theoretical background of the users.", "The detail of the product including the colors, sounds, and images to use, menu design, and icon design.", "The abstraction outlining what people can do with a product.", "The backend database architecture."], correct: 1, explanation: "التصميم الملموس (Concrete design) يهتم بتفاصيل المنتج كالألوان والأصوات وتصميم القوائم والأيقونات[cite: 2377]." },
            { chapter: "Mod2", question: "Why is 'Prototyping' important in Interaction Design?", options: ["It replaces the need for coding entirely.", "It is the most effective way for users to evaluate designs by interacting with them.", "It guarantees that the system will have no bugs.", "It allows designers to skip the requirements phase."], correct: 1, explanation: "النمذجة (Prototyping) هي الطريقة الأكثر فعالية للمستخدمين لتقييم التصاميم من خلال التفاعل معها بشكل مباشر[cite: 2378]." },
            { chapter: "Mod2", question: "The process of determining the usability and acceptability of the product or design is called:", options: ["Conceptualizing", "Discovering", "Evaluating", "Prototyping"], correct: 2, explanation: "التقييم (Evaluating) هو عملية تحديد قابلية الاستخدام وقبول المنتج أو التصميم[cite: 2379]." },
            { chapter: "Mod2", question: "Which of the following is true about Evaluation in the interaction design life cycle?", options: ["It replaces quality assurance (QA) and testing completely.", "It complements and enhances QA and testing activities.", "It is only done after the final product is built.", "It does not measure user-experience criteria."], correct: 1, explanation: "التقييم لا يحل محل ضمان الجودة (QA) والاختبار، بل يكمله ويعززه[cite: 2379]." },
            { chapter: "Mod2", question: "What are the five stages of Google Design Sprints?", options: ["Discover, Define, Develop, Deliver, Assess", "Plan, Analyze, Design, Build, Maintain", "Unpack, Sketch, Decide, Prototype, Test", "Brainstorm, Draft, Code, Test, Deploy"], correct: 2, explanation: "مراحل Google Design Sprints هي: التفريغ (Unpack)، الرسم (Sketch)، اتخاذ القرار (Decide)، النمذجة (Prototype)، والاختبار (Test)[cite: 2381]." },
            { chapter: "Mod2", question: "The framework for 'Research in the Wild' studies (Rogers and Marshall, 2017) connects which four components?", options: ["Theory, Technology, Design, In Situ Studies", "Users, Tasks, Context, Goals", "Hardware, Software, Interface, Environment", "Planning, Analysis, Design, Implementation"], correct: 0, explanation: "يتكون هذا الإطار من: النظرية (Theory)، التكنولوجيا (Technology)، التصميم (Design)، والدراسات الميدانية (In Situ Studies)[cite: 2383]." },
            { chapter: "Mod2", question: "When users rarely know what they need and what is possible, what must designers do?", options: ["Ask stakeholders to articulate technical requirements.", "Explore the problem space and investigate user activities to see what can be improved.", "Build a product and hope users like it.", "Avoid asking users any questions."], correct: 1, explanation: "يجب على المصممين استكشاف مساحة المشكلة والتحقيق في أنشطة المستخدمين لمعرفة ما يمكن تحسينه[cite: 2387]." },
            { chapter: "Mod2", question: "Which of the following is a recommended way to generate and choose among alternative designs?", options: ["Working solely on the first idea generated.", "Cross-fertilization of ideas from different perspectives.", "Avoiding user evaluation.", "Ignoring similar products and domains."], correct: 1, explanation: "تلقيح الأفكار المتبادل (Cross-fertilization) من وجهات نظر مختلفة يساعد في توليد واختيار البدائل الأفضل[cite: 2388]." },
            { chapter: "Mod2", question: "Integrating interaction design activities with agile software development is promising because:", options: ["It avoids iterative processes.", "It ignores emergent requirements.", "It incorporates tight iterations and champions early and regular feedback.", "It eliminates the need for any structure."], correct: 2, explanation: "منهجية أجايل واعدة لأنها تدمج التكرارات الضيقة وتدعم التغذية الراجعة المبكرة والمنتظمة[cite: 2389]." },
            { chapter: "Mod2", question: "In the simple interaction design life cycle, what directly follows 'Discovering Requirements'?", options: ["Final Product", "Evaluating", "Designing Alternatives", "Prototyping"], correct: 2, explanation: "وفقاً لدورة حياة التصميم التفاعلي، بعد اكتشاف المتطلبات يتم تصميم البدائل (Designing Alternatives)[cite: 2380]." },

            // ================= MODULE 3 (20 Qs) =================
            { chapter: "Mod3", question: "Taking something for granted when it needs further investigation is the definition of:", options: ["Claim", "Theory", "Assumption", "Framework"], correct: 2, explanation: "الافتراض (Assumption) هو أخذ شيء كأمر مُسلّم به وهو لا يزال يحتاج إلى مزيد من التحقق والبحث[cite: 2401]." },
            { chapter: "Mod3", question: "Stating something to be true when it is still open to question is the definition of:", options: ["Claim", "Assumption", "Vision", "Paradigm"], correct: 0, explanation: "الادعاء (Claim) هو التصريح بأن شيئاً ما صحيح بينما هو في الواقع لا يزال قابلاً للتساؤل[cite: 2402]." },
            { chapter: "Mod3", question: "Which of the following is a benefit of conceptualizing?", options: ["It writes the software code for the designers.", "It encourages design teams to ask specific questions to understand the conceptual model.", "It prevents the team from exploring alternatives.", "It eliminates the need for user testing."], correct: 1, explanation: "من فوائد وضع التصور (Conceptualizing) أنه يشجع الفرق على طرح أسئلة محددة للفهم والتوجيه (Orientation)[cite: 2408]." },
            { chapter: "Mod3", question: "According to Johnson and Henderson (2002), a conceptual model is:", options: ["A detailed diagram of hardware circuits.", "A high-level description of how a system is organized and operates.", "The final layout of widgets on a screen.", "A business plan for selling the product."], correct: 1, explanation: "النموذج المفاهيمي هو وصف عالي المستوى لكيفية تنظيم النظام وعمله[cite: 2410]." },
            { chapter: "Mod3", question: "Which of the following is a PRO of using interface metaphors?", options: ["They constrain designers in how they conceptualize a problem space.", "They make learning new systems easier by exploiting user’s familiar knowledge.", "They force users to understand only the system in terms of the metaphor.", "They can inadvertently transfer bad parts of existing designs."], correct: 1, explanation: "من الإيجابيات (Pros) أن استعارات الواجهة تجعل تعلم الأنظمة الجديدة أسهل بالاعتماد على المعرفة المألوفة للمستخدم[cite: 2416]." },
            { chapter: "Mod3", question: "Which of the following is a CON of using interface metaphors?", options: ["They make learning new systems impossible.", "They can constrain designers in the way that they conceptualize a problem space.", "They prevent the use of icons.", "They are only useful for expert users."], correct: 1, explanation: "من السلبيات (Cons) أنها قد تقيد المصممين في طريقة تصورهم وتفكيرهم في المشكلة[cite: 2416]." },
            { chapter: "Mod3", question: "Which interaction type is used for issuing commands and selecting options (e.g., telling a system to print a file)?", options: ["Conversing", "Exploring", "Instructing", "Manipulating"], correct: 2, explanation: "التوجيه أو إعطاء الأوامر (Instructing) يستخدم لإصدار الأوامر وتحديد الخيارات[cite: 2418, 2419]." },
            { chapter: "Mod3", question: "Which interaction type involves interacting with a conversational system (e.g., voice assistants, chatbots)?", options: ["Instructing", "Conversing", "Responding", "Exploring"], correct: 1, explanation: "المحادثة (Conversing) تُستخدم للتفاعل مع أنظمة حوارية مثل روبوتات الدردشة[cite: 2418, 2421]." },
            { chapter: "Mod3", question: "Which interaction type involves interacting with objects in a virtual or physical space (e.g., dragging, selecting, zooming)?", options: ["Manipulating", "Exploring", "Conversing", "Instructing"], correct: 0, explanation: "التلاعب/المعالجة (Manipulating) يتمحور حول التعامل المباشر مع الكائنات كالسحب والتحديد[cite: 2418, 2423]." },
            { chapter: "Mod3", question: "Which interaction type is designed for moving through a virtual environment or physical space (e.g., flying over 3D cities)?", options: ["Manipulating", "Responding", "Exploring", "Instructing"], correct: 2, explanation: "الاستكشاف (Exploring) هو واجهة للتحرك والملاحة داخل بيئات افتراضية أو مادية[cite: 2418, 2426]." },
            { chapter: "Mod3", question: "When the system initiates the interaction and the user chooses whether to respond (e.g., a smart watch alerting a milestone), this is called:", options: ["Exploring", "Responding", "Instructing", "Conversing"], correct: 1, explanation: "الاستجابة (Responding) تحدث عندما يبادر النظام بالتفاعل ويقوم بتنبيه المستخدم[cite: 2418, 2428]." },
            { chapter: "Mod3", question: "Direct Manipulation was coined by Ben Shneiderman (1983). Which of the following is an essential property of it?", options: ["Issuing commands with complex syntax.", "Rapid reversible actions with immediate feedback on object of interest.", "No representation of objects.", "Relying entirely on spoken dialogue."], correct: 1, explanation: "من الخصائص الأساسية للمعالجة المباشرة هي الأفعال السريعة القابلة للتراجع مع تغذية راجعة فورية[cite: 2424]." },
            { chapter: "Mod3", question: "Which of the following is a CON (disadvantage) of Direct Manipulation?", options: ["It is not helpful for novices.", "Error messages are needed too frequently.", "Not all tasks can be described by objects; some are better achieved through delegating.", "It makes experienced users work very slowly."], correct: 2, explanation: "من السلبيات أنه لا يمكن وصف جميع المهام ككائنات؛ بعض المهام (كالتدقيق الإملائي) تُنجز بشكل أفضل عبر التفويض (Delegating)[cite: 2425]." },
            { chapter: "Mod3", question: "A description of what the user is doing when interacting with a system (e.g., instructing, talking) is called:", options: ["Interface style", "Conceptual model", "Interaction type", "Paradigm"], correct: 2, explanation: "نوع التفاعل (Interaction type) يصف ما يفعله المستخدم أثناء التفاعل[cite: 2430]." },
            { chapter: "Mod3", question: "The kind of interface used to support the interaction (e.g., command, menu-based, gesture) is called:", options: ["Interaction type", "Interface style", "Vision", "Theory"], correct: 1, explanation: "أسلوب الواجهة (Interface style) هو نوع الواجهة المستخدمة لدعم التفاعل[cite: 2430]." },
            { chapter: "Mod3", question: "A general approach adopted by a community for carrying out research (e.g., desktop, ubiquitous computing) is called a:", options: ["Theory", "Vision", "Paradigm", "Framework"], correct: 2, explanation: "النموذج الفكري/النمط (Paradigm) هو نهج عام يتبناه المجتمع لإجراء البحوث[cite: 2432]." },
            { chapter: "Mod3", question: "A driving force that frames research and provides concrete scenarios of how society can use next-generation technologies is a:", options: ["Vision", "Theory", "Framework", "Paradigm"], correct: 0, explanation: "الرؤية (Vision) توفر سيناريوهات ملموسة لاستخدام تقنيات الجيل القادم[cite: 2433]." },
            { chapter: "Mod3", question: "An explanation of a phenomenon that can help identify factors relevant to design and evaluation is a:", options: ["Framework", "Paradigm", "Vision", "Theory"], correct: 3, explanation: "النظرية (Theory) هي تفسير لظاهرة معينة تفيد في تصميم وتقييم المنتجات[cite: 2433]." },
            { chapter: "Mod3", question: "A set of interrelated concepts and/or specific questions for 'what to look for' providing advice on how to design user experiences is a:", options: ["Theory", "Framework", "Paradigm", "Vision"], correct: 1, explanation: "الإطار (Framework) هو مجموعة مفاهيم مترابطة تقدم نصائح وتوجيهات لتصميم تجارب المستخدم[cite: 2434]." },
            { chapter: "Mod3", question: "Which interaction style is best for 'doing' types of tasks such as designing, drawing, flying, or driving?", options: ["Instructing", "Direct manipulation", "Conversing", "Responding"], correct: 1, explanation: "المعالجة المباشرة (Direct manipulation) هي الأنسب لمهام الأداء والعمل اليدوي والتصميم[cite: 2429]." },

            // ================= MODULE 4 (20 Qs) =================
            { chapter: "Mod4", question: "According to Norman (1993), which type of cognition involves people perceiving, acting, and reacting to events (e.g., driving a car)?", options: ["Reflective", "Slow thinking", "Experiential", "Intentional"], correct: 2, explanation: "الإدراك التجريبي (Experiential) يحدث عندما ندرك ونتصرف ونتفاعل مع الأحداث (مثل قيادة السيارة)[cite: 2444]." },
            { chapter: "Mod4", question: "According to Norman (1993), which type of cognition involves mental effort, attention, judgment, and decision-making (e.g., designing)?", options: ["Reflective", "Experiential", "Fast thinking", "Incidental"], correct: 0, explanation: "الإدراك التأملي (Reflective) يتطلب جهداً ذهنياً وانتباهاً لاتخاذ القرارات أو التصميم[cite: 2444]." },
            { chapter: "Mod4", question: "According to Kahneman (2011), 'Fast thinking' is characterized as:", options: ["Reflexive and effortless (e.g., 2+2).", "Logical and demanding.", "Requiring great concentration.", "Used only for complex problems."], correct: 0, explanation: "التفكير السريع (Fast thinking) انعكاسي ولا يتطلب جهداً، مثل حساب 2+2[cite: 2444]." },
            { chapter: "Mod4", question: "Recognizing and selecting things on which to concentrate at a point in time, from the range of possibilities available, is the definition of:", options: ["Perception", "Memory", "Attention", "Learning"], correct: 2, explanation: "الانتباه (Attention) هو عملية التعرف واختيار الأشياء للتركيز عليها[cite: 2448]." },
            { chapter: "Mod4", question: "What is a general finding regarding the effects of multitasking on memory and attention?", options: ["It always improves performance.", "It depends on the nature of the tasks and how much attention each demands.", "It is physically impossible.", "It only affects visual tasks."], correct: 1, explanation: "تأثير تعدد المهام يعتمد على طبيعة المهام ومقدار الانتباه الذي تتطلبه كل مهمة[cite: 2449]." },
            { chapter: "Mod4", question: "Information acquisition from the world and transformation into experiences is defined as:", options: ["Perception", "Attention", "Memory", "Learning"], correct: 0, explanation: "الإدراك الحسي (Perception) هو اكتساب المعلومات من العالم وتحويلها إلى تجارب[cite: 2450]." },
            { chapter: "Mod4", question: "Recalling of knowledge to act appropriately (e.g., recognizing someone's face) is the definition of:", options: ["Learning", "Perception", "Attention", "Memory"], correct: 3, explanation: "الذاكرة (Memory) هي استدعاء المعرفة للتصرف بشكل مناسب[cite: 2453]." },
            { chapter: "Mod4", question: "Which of the following statements about memory in user interfaces is TRUE?", options: ["We recall things much better than we recognize them.", "Command-based interfaces rely heavily on recognition.", "Graphical interfaces promote recognition rather than recall.", "Recall and recognition require the same cognitive effort."], correct: 2, explanation: "الواجهات الرسومية (GUIs) تدعم التعرف (Recognition) وهو أسهل بكثير من التذكر أو الاستدعاء (Recall)[cite: 2454]." },
            { chapter: "Mod4", question: "Learning that occurs without deliberate effort (e.g., recognizing people's faces, what you did today) is called:", options: ["Intentional learning", "Incidental learning", "Reflective cognition", "Slow thinking"], correct: 1, explanation: "التعلم العرضي أو غير المتعمد (Incidental learning) يحدث بدون جهد مقصود[cite: 2456]." },
            { chapter: "Mod4", question: "Learning that involves deliberate effort (e.g., studying for an exam, learning to cook) is called:", options: ["Incidental learning", "Experiential learning", "Intentional learning", "Fast thinking"], correct: 2, explanation: "التعلم المتعمد (Intentional learning) يتطلب جهداً للتركيز والدراسة، وهو أصعب[cite: 2456]." },
            { chapter: "Mod4", question: "Regarding reading, speaking, and listening, which statement is true?", options: ["Listening requires more cognitive effort than reading or speaking.", "Reading can be quicker than speaking or listening.", "Speaking is the fastest method of input.", "Everyone prefers reading to listening."], correct: 1, explanation: "القراءة قد تكون أسرع من التحدث أو الاستماع، على الرغم من أن الاستماع يتطلب جهداً معرفياً أقل[cite: 2458]." },
            { chapter: "Mod4", question: "Problem-solving, planning, reasoning, and decision-making all involve which type of cognition?", options: ["Reflective cognition", "Experiential cognition", "Incidental learning", "Fast thinking"], correct: 0, explanation: "جميع هذه العمليات تتطلب الإدراك التأملي (Reflective cognition) لأنها تتضمن التفكير الواعي[cite: 2460]." },
            { chapter: "Mod4", question: "What describes the knowledge users develop about how to use a system and what to do in unexpected situations?", options: ["External cognition", "Mental models", "Distributed cognition", "Gulf of execution"], correct: 1, explanation: "النماذج الذهنية (Mental models) تمثل المعرفة التي يطورها المستخدم حول كيفية عمل النظام واستخدامه[cite: 2464]." },
            { chapter: "Mod4", question: "When someone presses an elevator button multiple times thinking it will arrive faster, they are exhibiting an erroneous:", options: ["Gulf of execution", "Mental model", "External cognition", "Perceptual gap"], correct: 1, explanation: "هذا مثال تقليدي لنموذج ذهني خاطئ (Erroneous mental model) لكيفية عمل النظام[cite: 2465]." },
            { chapter: "Mod4", question: "The distance from the user to the physical system is known as the:", options: ["Gulf of evaluation", "Gulf of execution", "Cognitive gap", "Distributed network"], correct: 1, explanation: "فجوة التنفيذ (Gulf of execution) هي المسافة بين أهداف المستخدم والنظام المادي[cite: 2467]." },
            { chapter: "Mod4", question: "The distance from the physical system to the user is known as the:", options: ["Gulf of evaluation", "Gulf of execution", "Mental distance", "Semantic gap"], correct: 0, explanation: "فجوة التقييم (Gulf of evaluation) هي مدى قدرة المستخدم على تقييم حالة النظام بعد الإجراء[cite: 2467]." },
            { chapter: "Mod4", question: "Which cognitive framework involves interactions among people, the artifacts they use, and the environment in which they are working?", options: ["Mental models", "External cognition", "Distributed cognition", "Gulf of execution"], correct: 2, explanation: "الإدراك الموزع (Distributed cognition) يشمل تفاعل الأشخاص مع الأدوات والبيئة لمعالجة المعلومات[cite: 2468]." },
            { chapter: "Mod4", question: "Using diaries, reminders, calendars, and shopping lists to reduce memory load is an example of:", options: ["Distributed cognition", "External cognition", "Experiential learning", "Fast thinking"], correct: 1, explanation: "الاستعانة بأدوات تمثيل خارجية لتخفيف العبء على الذاكرة يسمى الإدراك الخارجي (External cognition)[cite: 2469]." },
            { chapter: "Mod4", question: "To capture users' attention at an interface, designers should:", options: ["Avoid using color entirely.", "Use perceptual boundaries (windows), color, reverse video, sound, and flashing lights.", "Hide important information.", "Use very small fonts."], correct: 1, explanation: "لجذب الانتباه، يُنصح باستخدام الحدود البصرية، الألوان، الصوت، والوميض باعتدال[cite: 2449]." },
            { chapter: "Mod4", question: "Speech-based menus and instructions should be:", options: ["Very detailed and long.", "Read rapidly with no intonation.", "Short.", "Presented without any feedback."], correct: 2, explanation: "قوائم التوجيه الصوتي يجب أن تكون قصيرة (Short) ليتمكن المستخدم من تذكرها[cite: 2459]." },

            // ================= MODULE 5 (20 Qs) =================
            { chapter: "Mod5", question: "According to conversational rules (Sacks et al., 1978), which of the following is a rule for coordinating talk?", options: ["The system automatically mutes all speakers.", "The current speaker chooses the next speaker by asking a question or request.", "Participants must type their responses.", "Conversations must not have farewell rituals."], correct: 1, explanation: "القاعدة الأولى للمحادثة هي أن المتحدث الحالي يختار المتحدث التالي عبر طرح سؤال أو طلب[cite: 2483]." },
            { chapter: "Mod5", question: "Which term refers to one party being present with another party, who is present in a physical space, such as a meeting room (e.g., using robots)?", options: ["Social presence", "Telepresence", "External cognition", "Anthropomorphism"], correct: 1, explanation: "التواجد عن بُعد (Telepresence) يعني حضور شخص تقنياً مع شخص آخر موجود في مساحة مادية[cite: 2487]." },
            { chapter: "Mod5", question: "Which term refers to the feeling of being there with a real person when in virtual reality?", options: ["Telepresence", "Social presence", "Distributed presence", "Cognitive presence"], correct: 1, explanation: "التواجد الاجتماعي (Social presence) هو الشعور بالتواجد مع شخص حقيقي داخل الواقع الافتراضي[cite: 2487]." },
            { chapter: "Mod5", question: "Participation in activities of a social group, which is voluntary and involves social exchange without pay, is defined as:", options: ["Social interaction", "Social engagement", "Telepresence", "Affective computing"], correct: 1, explanation: "المشاركة الاجتماعية (Social engagement) تعني المشاركة التطوعية غير المدفوعة في أنشطة جماعية وتتبادل اجتماعي[cite: 2489]." },
            { chapter: "Mod5", question: "Emotional interaction is concerned with:", options: ["How fast the backend server responds.", "How we feel and react when interacting with technologies.", "Only the physical design of the device.", "Writing code without errors."], correct: 1, explanation: "التفاعل العاطفي يهتم بكيفية شعورنا وردود أفعالنا عند التعامل مع التقنيات[cite: 2501]." },
            { chapter: "Mod5", question: "According to claims from the emotional model, when people are happy, they are:", options: ["More focused and their muscles tense.", "Less tolerant of minor problems.", "Less focused, their bodies relax, and they can be more creative.", "Unable to make rapid decisions."], correct: 2, explanation: "عند السعادة، يقل التركيز الضيق، تسترخي الأجسام، ويتجاهل الأشخاص المشاكل البسيطة ليصبحوا أكثر إبداعاً[cite: 2504]." },
            { chapter: "Mod5", question: "According to the claims from the emotional model, when frightened or angry, humans:", options: ["Relax and become more creative.", "Overlook minor problems.", "Focus narrowly and bodies respond by tensing muscles and sweating.", "Make decisions very easily."], correct: 2, explanation: "عند الخوف أو الغضب، يضيق التركيز وتستجيب الأجسام بشد العضلات والتعرق[cite: 2504]." },
            { chapter: "Mod5", question: "In the three levels of emotional design, which level refers to making products look, feel, and sound good (automatic sensory responses)?", options: ["Behavioral design", "Reflective design", "Visceral design", "Conceptual design"], correct: 2, explanation: "المستوى الحشوي (Visceral) يتعلق بالاستجابة التلقائية المسبقة للمظهر والصوت والشعور العام[cite: 2505]." },
            { chapter: "Mod5", question: "In emotional design, which level is about 'use' and equates with traditional values of usability (routine operations)?", options: ["Reflective design", "Behavioral design", "Visceral design", "Social design"], correct: 1, explanation: "المستوى السلوكي (Behavioral) يختص بالاستخدام والأنشطة الروتينية وقيم قابلية الاستخدام[cite: 2505]." },
            { chapter: "Mod5", question: "In emotional design, which level is about considering the meaning and personal value of a product?", options: ["Visceral design", "Behavioral design", "Reflective design", "Interaction design"], correct: 2, explanation: "المستوى التأملي (Reflective) يتعلق بالمعنى والقيمة الشخصية التي يمثلها المنتج للمستخدم[cite: 2505]." },
            { chapter: "Mod5", question: "Which of the following is a common cause of frustrating interfaces?", options: ["Providing context-sensitive help.", "A system requires users to carry out too many steps to perform a task.", "Aesthetically-pleasing minimalist design.", "Quick system response."], correct: 1, explanation: "من أسباب الإحباط في الواجهات هو إجبار المستخدم على أداء خطوات كثيرة جداً لإنجاز مهمة بسيطة[cite: 2509]." },
            { chapter: "Mod5", question: "According to Shneiderman’s classic guidelines for error messages, designers should AVOID using terms like:", options: ["'Please try again'", "'Error code 404'", "'FATAL', 'INVALID', or 'BAD'", "'Context-sensitive help'"], correct: 2, explanation: "ينصح شنايدرمان بتجنب استخدام كلمات سلبية ومخيفة مثل FATAL, INVALID, BAD[cite: 2510]." },
            { chapter: "Mod5", question: "How to use computers to recognize and express emotions as humans do is defined as:", options: ["Telepresence", "Affective computing", "Social engagement", "Anthropomorphism"], correct: 1, explanation: "الحوسبة العاطفية (Affective computing) هي استخدام الحواسيب للتعرف على المشاعر والتعبير عنها[cite: 2512]." },
            { chapter: "Mod5", question: "What is the goal of Emotional AI?", options: ["To automate the measurement of feelings and behavior using AI to infer them from facial expressions and voice.", "To replace humans in all customer service roles.", "To generate random errors.", "To speed up the internet connection."], correct: 0, explanation: "الذكاء الاصطناعي العاطفي يهدف لأتمتة قياس المشاعر والتنبؤ بها من خلال تعابير الوجه والصوت[cite: 2512]." },
            { chapter: "Mod5", question: "In affective computing, which technology is typically used to measure Galvanic Skin Response (GSR)?", options: ["Cameras", "Accelerometers", "Biosensors placed on fingers or palms", "Motion capture systems"], correct: 2, explanation: "تُستخدم المستشعرات الحيوية (Biosensors) على الأصابع أو راحة اليد لقياس استجابة الجلد (GSR)[cite: 2514]." },
            { chapter: "Mod5", question: "Attributing human-like qualities to inanimate objects is known as:", options: ["Telepresence", "Affective computing", "Anthropomorphism", "Emotional intelligence"], correct: 2, explanation: "التجسيد (Anthropomorphism) هو إضفاء صفات بشرية على الأشياء غير الحية (مثل الأنظمة والواجهات)[cite: 2517]." },
            { chapter: "Mod5", question: "What is a benefit of anthropomorphism in human-computer interaction?", options: ["It completely removes the need for graphical interfaces.", "It makes the system run twice as fast.", "It can make the user experience enjoyable and make people feel at ease by reducing anxiety.", "It prevents the user from making any errors."], correct: 2, explanation: "إضفاء صفات بشرية يجعل التجربة ممتعة ويريح المستخدمين ويقلل من قلقهم تجاه التكنولوجيا[cite: 2517]." },
            { chapter: "Mod5", question: "Technologies designed specifically to persuade people to change their behaviors (e.g., Nintendo’s Pocket Pikachu) are known as:", options: ["Persuasive Technologies", "Command-line tools", "Telepresence robots", "Virtual Reality headsets"], correct: 0, explanation: "التقنيات المقنعة (Persuasive Technologies) تصمم لتحفيز الأشخاص على تغيير سلوكياتهم، كتشجيعهم على النشاط البدني[cite: 2513, 2515]." },
            { chapter: "Mod5", question: "Which of the following is an example of 'Emotional data analysis' in practice?", options: ["A website adapting its content or ad to match a user's emotional state detected via facial expressions.", "A user typing a simple text message.", "A computer overheating.", "Using a standard mouse to click."], correct: 0, explanation: "تحليل البيانات العاطفية يتيح للأنظمة (كالمواقع أو السيارات) تكييف محتواها بناءً على مشاعر المستخدم المكتشفة[cite: 2515]." },
            { chapter: "Mod5", question: "In emotional analysis, what are the six core expressions typically measured?", options: ["Confusion, sleepiness, focus, hunger, thirst, anger", "Sadness, disgust, fear, anger, contempt, and joy", "Boredom, frustration, patronization, gimmicky, cutesy, fun", "Red, green, blue, yellow, black, white"], correct: 1, explanation: "التعابير الأساسية الستة المقاسة غالباً هي: الحزن، الاشمئزاز، الخوف، الغضب، الاحتقار، والفرح[cite: 2514]." }
        ];

        let questions = [];
        let userAnswers = [];
        let currentIdx = 0;
        let currentFilter = 'ALL';
        let currentLimit = 100;

        const questionCounter = document.getElementById('question-counter');
        const chapterBadge = document.getElementById('chapter-badge');
        const statusBadge = document.getElementById('status-badge');
        const scoreTracker = document.getElementById('score-tracker');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationBox = document.getElementById('explanation-box');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const finalScoreText = document.getElementById('final-score-text');
        const finalDetailsText = document.getElementById('final-details-text');
        const retryWrongBtn = document.getElementById('retry-wrong-btn');
        const wrongCountNum = document.getElementById('wrong-count-num');

        function filterChapter(ch) {
            currentFilter = ch;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${ch}`).classList.add('active');
            applyFilterAndLimit(false);
        }

        function setQuestionLimit(limit) {
            currentLimit = limit === 100 ? allQuestions.length : limit;
            document.querySelectorAll('.limit-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`limit-${limit}`).classList.add('active');
            applyFilterAndLimit(true);
        }

        function applyFilterAndLimit(shouldShuffle = false) {
            let pool = (currentFilter === 'ALL') ? [...allQuestions] : allQuestions.filter(q => q.chapter === currentFilter);
            if (shouldShuffle) {
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
            }
            questions = pool.slice(0, Math.min(currentLimit, pool.length));
            startQuizSession();
        }

        function shuffleCurrentPool() {
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            startQuizSession();
        }

        let isAutoNext = false;
        function toggleAutoNext() {
            isAutoNext = !isAutoNext;
            const icon = document.getElementById('auto-next-icon');
            const btn = document.getElementById('auto-next-toggle');
            if (isAutoNext) {
                icon.className = 'fa-solid fa-toggle-on text-emerald-500 text-sm transition-all';
                btn.classList.remove('text-gray-400');
                btn.classList.add('text-emerald-500');
            } else {
                icon.className = 'fa-solid fa-toggle-off text-gray-500 text-sm transition-all';
                btn.classList.remove('text-emerald-500');
                btn.classList.add('text-gray-400');
            }
        }

        function startQuizSession() {
            currentIdx = 0;
            userAnswers = new Array(questions.length).fill(null);
            updateScoreTracker();
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            loadQuestion();
        }

        function getCurrentScore() {
            return userAnswers.reduce((acc, ans, idx) => acc + (ans === questions[idx].correct ? 1 : 0), 0);
        }

        function updateScoreTracker() {
            const currentScore = getCurrentScore();
            document.getElementById('score-tracker').innerText = `الصحيحة: ${currentScore}`;
            if (document.getElementById('score-tracker-mobile')) {
                document.getElementById('score-tracker-mobile').innerText = currentScore;
            }
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            const savedAnswer = userAnswers[currentIdx];

            questionCounter.innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            chapterBadge.innerText = q.chapter;
            progressBar.style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            questionText.innerText = q.question;

            const telegramUsername = "jory976";
            const qOriginalNum = (currentIdx + 1);
            const reportMessage = `السلام عليكم فهد، عندي ملاحظة في كويزات IT352 (Slides 1-5):\n- الوحدة: (${q.chapter})\n- السؤال: "${q.question}"\n\nالملاحظة: `;
            document.getElementById('report-btn').href = `https://t.me/${telegramUsername}?text=${encodeURIComponent(reportMessage)}`;
            
            prevBtn.disabled = (currentIdx === 0);
            nextBtn.innerHTML = (currentIdx === questions.length - 1) ? `النتيجة النهائية <i class="fa-solid fa-flag-checkered mr-2"></i>` : `التالي <i class="fa-solid fa-arrow-left mr-2"></i>`;

            optionsContainer.innerHTML = '';

            if (savedAnswer === null) {
                statusBadge.className = "bg-gray-800 text-gray-400 text-xs px-3 py-1 rounded-full shadow-sm";
                statusBadge.innerText = "لم تتم الإجابة";
                statusBadge.classList.remove('hidden');
                explanationBox.classList.add('hidden');
            } else if (savedAnswer === q.correct) {
                statusBadge.className = "bg-emerald-500/20 text-emerald-500 text-xs px-3 py-1 rounded-full font-bold shadow-sm";
                statusBadge.innerText = "إجابة صحيحة";
                statusBadge.classList.remove('hidden');
            } else {
                statusBadge.className = "bg-rose-500/20 text-rose-500 text-xs px-3 py-1 rounded-full font-bold shadow-sm";
                statusBadge.innerText = "إجابة خاطئة";
                statusBadge.classList.remove('hidden');
            }

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                if (savedAnswer === null) {
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border border-gray-700 bg-gray-900/60 text-gray-200 font-medium flex justify-between items-center gap-3";
                    btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-500 shrink-0"></i>`;
                    btn.onclick = () => selectAnswer(index);
                } else {
                    btn.disabled = true;
                    if (index === q.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-500/20 text-white font-bold flex justify-between items-center gap-3";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-check text-emerald-500 shrink-0"></i>`;
                    } else if (index === savedAnswer && savedAnswer !== q.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-500/20 text-white font-bold flex justify-between items-center gap-3";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-xmark text-rose-500 shrink-0"></i>`;
                    } else {
                        btn.className = "w-full text-left p-4 rounded-xl border border-gray-800 bg-gray-900/40 text-gray-500 font-medium flex justify-between items-center gap-3 opacity-60";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-600 shrink-0"></i>`;
                    }
                }
                optionsContainer.appendChild(btn);
            });

            if (savedAnswer !== null) {
                explanationBox.innerHTML = `<strong class="text-cyan">توضيح:</strong> ${q.explanation}`;
                explanationBox.classList.remove('hidden');
            }
        }

        function selectAnswer(selectedIdx) {
            userAnswers[currentIdx] = selectedIdx;
            updateScoreTracker();
            loadQuestion();
            if (isAutoNext && selectedIdx === questions[currentIdx].correct) {
                setTimeout(() => nextQuestion(), 400);
            }
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            
            const finalScore = getCurrentScore();
            const total = questions.length;
            const percentage = Math.round((finalScore / total) * 100);
            
            let wrongOnlyCount = 0;
            let unansweredCount = 0;
            
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === null) unansweredCount++;
                else if (userAnswers[idx] !== q.correct) wrongOnlyCount++;
            });

            finalScoreText.innerText = `حصلت على ${finalScore} من ${total} (${percentage}%)`;
            finalDetailsText.innerText = `إجابات صحيحة: ${finalScore} | إجابات خاطئة: ${wrongOnlyCount} | لم تتم الإجابة: ${unansweredCount}`;

            const reviewPoolCount = wrongOnlyCount + unansweredCount;
            if (reviewPoolCount > 0) {
                wrongCountNum.innerText = reviewPoolCount;
                retryWrongBtn.classList.remove('hidden');
            } else {
                retryWrongBtn.classList.add('hidden');
            }
        }

        function retryWrongQuestions() {
            const wrongQuestions = questions.filter((q, idx) => userAnswers[idx] !== q.correct);
            if (wrongQuestions.length > 0) {
                questions = wrongQuestions;
                startQuizSession();
            }
        }

        applyFilterAndLimit(false);
    </script>
</body>
</html>
