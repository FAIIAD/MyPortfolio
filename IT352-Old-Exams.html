    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',

                extend: {
                    colors: {
                        dark: '#0f111a',     // خلفية داكنة ليلية عصرية

        html:not(.dark) .text-gray-200, html:not(.dark) .text-gray-300 { color: #1e293b; }
        html:not(.dark) .text-gray-400, html:not(.dark) .text-gray-500, html:not(.dark) .text-gray-600 { color: #475569; }

    <script>
        const themeIcon = document.getElementById('theme-icon');
        function updateThemeIcon() {
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.className = 'fa-solid fa-moon text-primary text-xs';
            } else {
                themeIcon.className = 'fa-solid fa-sun text-amber-500 text-xs';
            }
        }
        updateThemeIcon();

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        const allQuestions = [
            // ================= MODULE 1 (20 Questions) =================
            {
                chapter: "Mod1",
                question: "1. Making products and services that accommodate the widest possible number of people is the definition of:",
                options: ["Inclusiveness", "User-centered techniques", "Users involvement", "Accessibility"],
                correct: 0,
                explanation: "تم تعريف Inclusiveness على أنها صنع المنتجات والخدمات التي تتسع وتلبي احتياجات أكبر عدد ممكن من الناس[cite: 1964, 2010]."
            },
            {
                chapter: "Mod1",
                question: "2. The social sciences, computing sciences, engineering, ergonomics, and informatics are considered the:",
                options: ["Design Perspective of Interaction Design", "Social Perspective of Interaction Design", "Academic Perspective of Interaction Design", "Industry Perspective of Interaction Design"],
                correct: 2,
                explanation: "تعتبر هذه التخصصات (العلوم الاجتماعية، الحوسبة، الهندسة، إلخ) هي المنظور الأكاديمي (Academic Perspective) لتصميم التفاعل[cite: 1970, 2010]."
            },
            {
                chapter: "Mod1",
                question: "3. Which aspect differentiates Interaction Design from traditional UI Design?",
                options: ["Emphasis on hardware interaction", "Focus on backend programming", "Integration of user emotions and behaviors", "Priority on graphic elements"],
                correct: 2,
                explanation: "تصميم التفاعل يركز بشكل كبير على دمج مشاعر المستخدم وسلوكياته (Integration of user emotions and behaviors) مقارنة بتصميم الواجهات التقليدي[cite: 1942, 1943]."
            },
            {
                chapter: "Mod1",
                question: "4. What greatly enhances the Human-Computer Interaction (HCI) user experience?",
                options: ["Complexity", "Cost", "Intuitiveness", "Rarity"],
                correct: 2,
                explanation: "الـ Intuitiveness (البديهية وسهولة الفهم) هي أحد أهم العوامل التي تحسن تجربة المستخدم في تفاعل الإنسان والحاسوب[cite: 1917]."
            },
            {
                chapter: "Mod1",
                question: "5. The extent to which an interactive product is accessible by as many people as possible is:",
                options: ["Accessibility", "Sketching", "Storyboarding", "Inclusiveness"],
                correct: 0,
                explanation: "إمكانية الوصول (Accessibility) تُعرف بأنها المدى الذي يمكن فيه لأكبر عدد ممكن من الأشخاص الوصول للمنتج واستخدامه[cite: 1929, 1930, 1988]."
            },
            {
                chapter: "Mod1",
                question: "6. Similar operations must have similar elements for similar tasks. This is a definition of:",
                options: ["Safety", "Usability", "Accessibility", "Consistency"],
                correct: 3,
                explanation: "التناسق (Consistency) يعني أن العمليات المتشابهة يجب أن تمتلك عناصر متشابهة لإنجاز المهام المتشابهة[cite: 1991, 2005, 2006]."
            },
            {
                chapter: "Mod1",
                question: "7. Designing the exact same operations and interfaces across different applications and devices refers to:",
                options: ["Virtual consistency", "Internal consistency", "Inconsistency", "External consistency"],
                correct: 3,
                explanation: "التناسق الخارجي (External consistency) هو تصميم نفس العمليات والواجهات عبر تطبيقات وأجهزة مختلفة لتسهيل التعلم[cite: 1959]."
            },
            {
                chapter: "Mod1",
                question: "8. Which of the following is a very general goal of usability that refers to how good a system is at doing what it is supposed to do?",
                options: ["Effectiveness", "Suppose to do", "Efficiency", "Utility"],
                correct: 0,
                explanation: "الفعالية (Effectiveness) هي هدف عام لقابلية الاستخدام يقيس مدى جودة النظام في أداء ما يُفترض به أن يفعله[cite: 1958]."
            },
            {
                chapter: "Mod1",
                question: "9. Which discipline is NOT typically listed as part of the 'Academic Perspective' of Interaction Design?",
                options: ["Ergonomics", "Informatics", "Computing sciences", "Graphic Design"],
                correct: 3,
                explanation: "التصميم الجرافيكي (Graphic Design) يُعتبر من الممارسات التصميمية (Design Practices) وليس من التخصصات الأكاديمية مثل الحوسبة والمعلوماتية[cite: 1970, 2010]."
            },
            {
                chapter: "Mod1",
                question: "10. Which statement best defines 'Inclusiveness' in HCI?",
                options: ["Focusing only on the majority of users.", "Aimed to address the needs of as diverse a user base as possible.", "Unique requirements of specialist user groups.", "Aesthetic preferences of various cultures."],
                correct: 1,
                explanation: "الشمولية (Inclusiveness) في تفاعل الإنسان والحاسوب تهدف إلى تلبية احتياجات قاعدة مستخدمين متنوعة قدر الإمكان[cite: 1932, 1933]."
            },
            {
                chapter: "Mod1",
                question: "11. 'Accessibility' in interaction design primarily focuses on:",
                options: ["The visual aesthetics of a product.", "Making a product available to as many people as possible, including those with disabilities.", "The cost-effectiveness of the user interface.", "How fast the system processes user inputs."],
                correct: 1,
                explanation: "إمكانية الوصول (Accessibility) تركز على المدى الذي يكون فيه المنتج متاحاً لأكبر عدد ممكن من الناس، وغالباً ما يستهدف ذوي الإعاقة[cite: 1929, 1930, 1988]."
            },
            {
                chapter: "Mod1",
                question: "12. What is the primary difference between 'Internal consistency' and 'External consistency'?",
                options: ["Internal focuses on colors; External focuses on shapes.", "Internal is across different devices; External is within one app.", "Internal designs operations to act the same within an application; External designs them across applications.", "There is no difference."],
                correct: 2,
                explanation: "التناسق الداخلي (Internal) يكون داخل التطبيق نفسه، بينما التناسق الخارجي (External) يكون عبر تطبيقات وأجهزة متعددة[cite: 1959]."
            },
            {
                chapter: "Mod1",
                question: "13. The concept that states 'interactive products should accommodate the widest possible number of people' is distinctively called:",
                options: ["Inclusiveness", "Usability Testing", "Efficiency", "Learnability"],
                correct: 0,
                explanation: "صنع منتجات تستوعب أوسع نطاق ممكن من الأشخاص هو التعريف الدقيق لـ Inclusiveness[cite: 1964, 2010]."
            },
            {
                chapter: "Mod1",
                question: "14. A user-friendly system that allows users to quickly perform tasks without confusion is exhibiting high:",
                options: ["Rarity", "Complexity", "Intuitiveness", "Cost"],
                correct: 2,
                explanation: "البديهية (Intuitiveness) هي ما يجعل النظام سهل الفهم والاستخدام دون تعقيد مما يعزز تجربة المستخدم[cite: 1917]."
            },
            {
                chapter: "Mod1",
                question: "15. Which of the following is considered an 'Academic' discipline that informs Interaction Design?",
                options: ["Social sciences", "Product design", "Artist-design", "Film industry"],
                correct: 0,
                explanation: "العلوم الاجتماعية (Social sciences) تُصنف كمنظور وتخصص أكاديمي يساهم في تصميم التفاعل[cite: 1970, 2010]."
            },
            {
                chapter: "Mod1",
                question: "16. Which of the following is a key goal of usability in Interaction Design?",
                options: ["Making the code run faster on servers", "Ensuring the system is effective and does what it is supposed to do", "Reducing the cost of hardware", "Adding as many features as possible"],
                correct: 1,
                explanation: "الفعالية (Effectiveness) هي هدف أساسي لقابلية الاستخدام (Usability) وتُعنى بمدى جودة النظام في أداء المطلوب منه[cite: 1958]."
            },
            {
                chapter: "Mod1",
                question: "17. A design approach that integrates user emotions, behaviors, and everyday interactions is central to:",
                options: ["Database Management", "Interaction Design", "Network Architecture", "Compiler Construction"],
                correct: 1,
                explanation: "تصميم التفاعل (Interaction Design) يدمج المشاعر والسلوكيات في تصميمه لتجربة المستخدم[cite: 1942, 1943]."
            },
            {
                chapter: "Mod1",
                question: "18. What usability goal is achieved when all similar navigation menus are placed in the exact same location across all screens?",
                options: ["External consistency", "Internal consistency", "Accessibility", "Inclusiveness"],
                correct: 1,
                explanation: "تطبيق نفس العمليات (مثل القوائم) داخل نفس التطبيق هو مثال على التناسق الداخلي (Internal consistency)[cite: 1959, 1991]."
            },
            {
                chapter: "Mod1",
                question: "19. Using the 'Ctrl+C' shortcut for copying text in Word, Excel, and an Internet browser is an example of:",

                explanation: "الحوسبة العاطفية تقيس الـ GSR وتعابير الوجه وحركة الجسم لفهم المشاعر، ولا علاقة لها بأداء قواعد البيانات (Database performance)[cite: 1958]."

            {
                chapter: "Mod5",
                question: "100. Emotional Intelligence in the context of HCI involves:",
                options: ["Programming robots to repair themselves.", "Understanding relationships between facial expressions, body language, gestures, and tone of voice.", "Predicting stock market crashes.", "Using fast thinking to solve equations."],
                correct: 1,
                explanation: "الذكاء العاطفي يتضمن فهم العلاقة بين تعابير الوجه ولغة الجسد والإيماءات ونبرة الصوت للتعرف على المشاعر[cite: 1957]."

        ];

        let questions = [];
        let userAnswers = [];
        let currentIdx = 0;
        let currentFilter = 'ALL';
        let currentLimit = 100;

        const questionCounter = document.getElementById('question-counter');
        const chapterBadge = document.getElementById('chapter-badge');
        const statusBadge = document.getElementById('status-badge');
        const scoreTracker = document.getElementById('score-tracker');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationBox = document.getElementById('explanation-box');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const finalScoreText = document.getElementById('final-score-text');
        const finalDetailsText = document.getElementById('final-details-text');
        const retryWrongBtn = document.getElementById('retry-wrong-btn');
        const wrongCountNum = document.getElementById('wrong-count-num');

        function filterChapter(ch) {
            currentFilter = ch;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${ch}`).classList.add('active');
            applyFilterAndLimit(false);
        }

        function setQuestionLimit(limit) {
            currentLimit = limit === 100 ? allQuestions.length : limit;
            document.querySelectorAll('.limit-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`limit-${limit}`).classList.add('active');
            applyFilterAndLimit(true);
        }

        function applyFilterAndLimit(shouldShuffle = false) {
            let pool = (currentFilter === 'ALL') 
                ? [...allQuestions] 
                : allQuestions.filter(q => q.chapter === currentFilter);

            if (shouldShuffle) {
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
            }

            questions = pool.slice(0, Math.min(currentLimit, pool.length));
            startQuizSession();
        }

        function shuffleCurrentPool() {
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            startQuizSession();
        }

        let isAutoNext = false;
        function toggleAutoNext() {
            isAutoNext = !isAutoNext;
            const icon = document.getElementById('auto-next-icon');
            const btn = document.getElementById('auto-next-toggle');
            if (isAutoNext) {
                icon.className = 'fa-solid fa-toggle-on text-emerald-500 text-sm transition-all';
                btn.classList.remove('text-gray-400');
                btn.classList.add('text-emerald-500');
            } else {
                icon.className = 'fa-solid fa-toggle-off text-gray-500 text-sm transition-all';
                btn.classList.remove('text-emerald-500');
                btn.classList.add('text-gray-400');
            }
        }

        function startQuizSession() {
            currentIdx = 0;
            userAnswers = new Array(questions.length).fill(null);
            updateScoreTracker();
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            loadQuestion();
        }

        function getCurrentScore() {
            return userAnswers.reduce((acc, ans, idx) => {
                return acc + (ans === questions[idx].correct ? 1 : 0);
            }, 0);
        }

        function updateScoreTracker() {
            const currentScore = getCurrentScore();
            document.getElementById('score-tracker').innerText = `الصحيحة: ${currentScore}`;
            if (document.getElementById('score-tracker-mobile')) {
                document.getElementById('score-tracker-mobile').innerText = currentScore;
            }
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            const savedAnswer = userAnswers[currentIdx];

            questionCounter.innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            chapterBadge.innerText = q.chapter;
            progressBar.style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            questionText.innerText = q.question;

            const telegramUsername = "jory976";
            const qNumMatch = q.question.match(/^\d+/);
            const qOriginalNum = qNumMatch ? qNumMatch[0] : (currentIdx + 1);
            const reportMessage = `السلام عليكم فهد، عندي ملاحظة في كويزات IT352 (Modules 1-5):\n- رقم السؤال: (${qOriginalNum})\n- الوحدة: (${q.chapter})\n- السؤال: "${q.question}"\n\nالملاحظة: `;
            document.getElementById('report-btn').href = `https://t.me/${telegramUsername}?text=${encodeURIComponent(reportMessage)}`;
            
            prevBtn.disabled = (currentIdx === 0);
            nextBtn.innerHTML = (currentIdx === questions.length - 1) 
                ? `النتيجة النهائية <i class="fa-solid fa-flag-checkered mr-2"></i>` 
                : `التالي <i class="fa-solid fa-arrow-left mr-2"></i>`;

            optionsContainer.innerHTML = '';

            if (savedAnswer === null) {
                statusBadge.className = "bg-gray-800 text-gray-400 text-xs px-3 py-1 rounded-full shadow-sm";
                statusBadge.innerText = "لم تتم الإجابة";
                statusBadge.classList.remove('hidden');
                explanationBox.classList.add('hidden');
            } else if (savedAnswer === q.correct) {
                statusBadge.className = "bg-emerald-500/20 text-emerald-500 text-xs px-3 py-1 rounded-full font-bold shadow-sm";
                statusBadge.innerText = "إجابة صحيحة";
                statusBadge.classList.remove('hidden');
            } else {
                statusBadge.className = "bg-rose-500/20 text-rose-500 text-xs px-3 py-1 rounded-full font-bold shadow-sm";
                statusBadge.innerText = "إجابة خاطئة";
                statusBadge.classList.remove('hidden');
            }

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                
                if (savedAnswer === null) {
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border border-gray-700 bg-gray-900/60 text-gray-200 font-medium flex justify-between items-center gap-3";
                    btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-500 shrink-0"></i>`;
                    btn.onclick = () => selectAnswer(index);
                } else {
                    btn.disabled = true;
                    if (index === q.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-500/20 text-white font-bold flex justify-between items-center gap-3";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-check text-emerald-500 shrink-0"></i>`;
                    } else if (index === savedAnswer && savedAnswer !== q.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-500/20 text-white font-bold flex justify-between items-center gap-3";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-xmark text-rose-500 shrink-0"></i>`;
                    } else {
                        btn.className = "w-full text-left p-4 rounded-xl border border-gray-800 bg-gray-900/40 text-gray-500 font-medium flex justify-between items-center gap-3 opacity-60";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-600 shrink-0"></i>`;
                    }
                }
                optionsContainer.appendChild(btn);
            });

            if (savedAnswer !== null) {
                explanationBox.innerHTML = `<strong class="text-cyan">توضيح:</strong> ${q.explanation}`;
                explanationBox.classList.remove('hidden');
            }
        }

        function selectAnswer(selectedIdx) {
            userAnswers[currentIdx] = selectedIdx;
            updateScoreTracker();
            loadQuestion();

            if (isAutoNext && selectedIdx === questions[currentIdx].correct) {
                setTimeout(() => {
                    nextQuestion();
                }, 400);
            }
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            
            const finalScore = getCurrentScore();
            const total = questions.length;
            const percentage = Math.round((finalScore / total) * 100);
            
            let wrongOnlyCount = 0;
            let unansweredCount = 0;
            
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === null) {
                    unansweredCount++;
                } else if (userAnswers[idx] !== q.correct) {
                    wrongOnlyCount++;
                }
            });

            finalScoreText.innerText = `حصلت على ${finalScore} من ${total} (${percentage}%)`;
            finalDetailsText.innerText = `إجابات صحيحة: ${finalScore} | إجابات خاطئة: ${wrongOnlyCount} | لم تتم الإجابة: ${unansweredCount}`;

            const reviewPoolCount = wrongOnlyCount + unansweredCount;
            if (reviewPoolCount > 0) {
                wrongCountNum.innerText = reviewPoolCount;
                retryWrongBtn.classList.remove('hidden');
            } else {
                retryWrongBtn.classList.add('hidden');
            }
        }

        function retryWrongQuestions() {
            const wrongQuestions = questions.filter((q, idx) => userAnswers[idx] !== q.correct);
            if (wrongQuestions.length > 0) {
                questions = wrongQuestions;
                startQuizSession();
            }
        }

        applyFilterAndLimit(false);
    </script>
