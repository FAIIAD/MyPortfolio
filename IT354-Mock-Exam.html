<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تجريبي IT354 | فهد الزعبي</title>
    
    <!-- خط ثمانية والأيقونات -->
    <link href="https://cdn.jsdelivr.net/npm/@dawod/thmanyah-font-web/index.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        cyan: '#06b6d4',
                        blue: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Thmanyah Sans', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Thmanyah Serif Display', serif; }
        .option-btn { transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) {
            border-color: #06b6d4;
            background-color: rgba(6, 182, 212, 0.1);
            transform: translateX(-4px);
        }
    </style>
</head>
<body class="bg-dark text-gray-200 min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <!-- شريط علوي للعودة -->
    <header class="bg-dark/70 backdrop-blur-md border-b border-gray-800 py-4 px-6 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-gray-400 hover:text-cyan transition-colors font-semibold flex items-center gap-2">
                <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
            </a>
            <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan to-blue">IT354 - Mock Exam</h1>
        </div>
    </header>

    <!-- حاوية الاختبار -->
    <main class="container mx-auto px-4 py-12 flex-grow flex items-center justify-center">
        <div class="w-full max-w-2xl bg-card/60 backdrop-blur-md border border-gray-800 rounded-2xl p-6 md:p-8 shadow-xl">
            
            <!-- شاشة الأسئلة -->
            <div id="quiz-container">
                <!-- شريط التقدم والعداد -->
                <div class="flex justify-between items-center mb-4 text-sm text-gray-400">
                    <span id="question-counter" class="font-bold text-cyan">السؤال 1 من 5</span>
                    <span id="score-tracker">النقاط: 0</span>
                </div>
                <div class="w-full bg-gray-800 h-2 rounded-full mb-8 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-cyan to-blue h-full transition-all duration-300" style="width: 20%"></div>
                </div>

                <!-- نص السؤال (من اليسار لليمين لأن مصطلحات الـ IT بالإنجليزية) -->
                <h2 id="question-text" dir="ltr" class="text-xl md:text-2xl font-bold text-white mb-6 text-left leading-relaxed"></h2>

                <!-- الخيارات -->
                <div id="options-container" dir="ltr" class="space-y-3 text-left mb-6"></div>

                <!-- صندوق الشرح بعد الإجابة -->
                <div id="explanation-box" class="hidden p-4 rounded-xl bg-gray-800/80 border border-gray-700 text-sm text-gray-300 mb-6 leading-relaxed"></div>

                <!-- زر السؤال التالي -->
                <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-gradient-to-r from-cyan to-blue hover:from-blue hover:to-cyan text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 shadow-lg">
                    السؤال التالي <i class="fa-solid fa-arrow-left mr-2"></i>
                </button>
            </div>

            <!-- شاشة النتيجة النهائية (مخفية افتراضياً) -->
            <div id="result-container" class="hidden text-center py-8">
                <div class="w-20 h-20 bg-cyan/20 rounded-full flex items-center justify-center mx-auto mb-6 text-cyan text-4xl">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h2 class="text-3xl font-bold text-white mb-2">انتهى الاختبار!</h2>
                <p id="final-score-text" class="text-xl text-gray-400 mb-8"></p>
                
                <div class="flex justify-center gap-4">
                    <button onclick="restartQuiz()" class="bg-gradient-to-r from-cyan to-blue text-white font-bold py-3 px-8 rounded-full hover:shadow-[0_0_20px_rgba(6,182,212,0.5)] transition-all">
                        <i class="fa-solid fa-rotate-right ml-2"></i> إعادة الاختبار
                    </button>
                    <a href="index.html" class="border border-gray-600 hover:border-cyan hover:text-cyan text-gray-300 font-bold py-3 px-8 rounded-full transition-all">
                        الرئيسية
                    </a>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center py-6 text-gray-600 text-sm border-t border-gray-800">
        &copy; 2026 فهد الزعبي — IT Study Hub
    </footer>

    <!-- برمجة الاختبار وإضافة الأسئلة -->
    <script>
        // مصفوفة الأسئلة - يمكنك إضافة أو تعديل الأسئلة هنا بسهولة
        const questions = [
            {
                question: "Which SQL category is used to define and modify the database structure itself (such as CREATE, ALTER, DROP)?",
                options: [
                    "DML (Data Manipulation Language)",
                    "DDL (Data Definition Language)",
                    "DCL (Data Control Language)",
                    "TCL (Transaction Control Language)"
                ],
                correct: 1, // رقم الإجابة الصحيحة (تبدأ من 0)
                explanation: "أوامر DDL (لغة تعريف البيانات) هي المسؤولة عن إنشاء وتعديل هيكلة الجداول وقواعد البيانات مثل CREATE و DROP."
            },
            {
                question: "In a relational database, what uniquely identifies each record (row) in a table and cannot contain NULL values?",
                options: [
                    "Foreign Key",
                    "Super Key",
                    "Primary Key",
                    "Secondary Index"
                ],
                correct: 2,
                explanation: "المفتاح الأساسي (Primary Key) يضمن عدم تكرار السجلات ولا يقبل القيم الفارغة (NULL)."
            },
            {
                question: "A table is in Second Normal Form (2NF) if it is in 1NF and contains no:",
                options: [
                    "Partial Dependencies",
                    "Transitive Dependencies",
                    "Multi-valued Attributes",
                    "Foreign Keys"
                ],
                correct: 0,
                explanation: "لتحقيق الصيغة المعيارية الثانية (2NF)، يجب أن يكون الجدول في 1NF مع إزالة أي اعتماد جزئي (Partial Dependency) على المفتاح المركب."
            },
            {
                question: "Which ACID property ensures that a database transaction is treated as a single 'all or nothing' unit?",
                options: [
                    "Consistency",
                    "Isolation",
                    "Durability",
                    "Atomicity"
                ],
                correct: 3,
                explanation: "الذرية (Atomicity) تضمن تنفيذ كافة عمليات الـ Transaction بالكامل أو إلغاءها بالكامل في حال حدوث أي خطأ."
            },
            {
                question: "Which database object automatically executes a specified action when an INSERT, UPDATE, or DELETE event occurs on a table?",
                options: [
                    "View",
                    "Trigger",
                    "Cursor",
                    "Sequence"
                ],
                correct: 1,
                explanation: "الـ Trigger هو كود مخزن يعمل تلقائياً عند وقوع حدث معين (إضافة، تحديث، أو حذف) على الجدول."
            }
        ];

        let currentIdx = 0;
        let score = 0;

        const questionCounter = document.getElementById('question-counter');
        const scoreTracker = document.getElementById('score-tracker');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationBox = document.getElementById('explanation-box');
        const nextBtn = document.getElementById('next-btn');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const finalScoreText = document.getElementById('final-score-text');

        function loadQuestion() {
            const q = questions[currentIdx];
            questionCounter.innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            progressBar.style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            questionText.innerText = q.question;
            
            optionsContainer.innerHTML = '';
            explanationBox.classList.add('hidden');
            nextBtn.classList.add('hidden');

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-4 rounded-xl border border-gray-700 bg-gray-900/60 text-gray-200 font-medium flex justify-between items-center";
                btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-500"></i>`;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIdx, selectedBtn) {
            const q = questions[currentIdx];
            const allButtons = optionsContainer.querySelectorAll('button');
            
            // تعطيل الأزرار بعد اختيار إجابة
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIdx === q.correct) {
                score++;
                scoreTracker.innerText = `النقاط: ${score}`;
                selectedBtn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-500/20 text-white font-bold flex justify-between items-center";
                selectedBtn.querySelector('i').className = "fa-solid fa-circle-check text-emerald-400";
            } else {
                selectedBtn.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-500/20 text-white font-bold flex justify-between items-center";
                selectedBtn.querySelector('i').className = "fa-solid fa-circle-xmark text-rose-400";
                
                // إظهار الإجابة الصحيحة باللون الأخضر
                const correctBtn = allButtons[q.correct];
                correctBtn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-500/20 text-white font-bold flex justify-between items-center";
                correctBtn.querySelector('i').className = "fa-solid fa-circle-check text-emerald-400";
            }

            // عرض الشرح
            explanationBox.innerHTML = `<strong class="text-cyan">توضيح:</strong> ${q.explanation}`;
            explanationBox.classList.remove('hidden');

            // إظهار زر التالي
            nextBtn.innerText = (currentIdx === questions.length - 1) ? "عرض النتيجة النهائية" : "السؤال التالي";
            nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            const percentage = Math.round((score / questions.length) * 100);
            finalScoreText.innerText = `حصلت على ${score} من ${questions.length} (${percentage}%)`;
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            scoreTracker.innerText = `النقاط: 0`;
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            loadQuestion();
        }

        // بدء الاختبار عند تحميل الصفحة
        loadQuestion();
    </script>
</body>
</html>
