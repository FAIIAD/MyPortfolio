                <button onclick="filterChapter('Mod4')" id="btn-Mod4" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Mod 4 (20)</button>
                <button onclick="filterChapter('Mod5')" id="btn-Mod5" class="filter-btn text-xs px-3 py-1.5 rounded-full border border-gray-700 bg-card text-gray-300 font-bold transition-all">Mod 5 (20)</button>

                    <button onclick="applyFilterAndLimit(false)" class="bg-gradient-to-r from-primary to-secondary text-white font-bold py-3 px-8 rounded-full hover:shadow-[0_0_20px_rgba(139,92,246,0.5)] transition-all">

    <script>
        const themeIcon = document.getElementById('theme-icon');
        function updateThemeIcon() {
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.className = 'fa-solid fa-moon text-primary text-xs';
            } else {
                themeIcon.className = 'fa-solid fa-sun text-amber-500 text-xs';
            }
        }
        updateThemeIcon();

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        const allQuestions = [
            // ================= MODULE 1 (20 Questions) =================
            {
                chapter: "Mod1",
                question: "1. The complex organizational process whereby computer-based information systems are developed and maintained is known as:",
                options: ["Application Software", "Systems Analysis and Design", "Business Process Reengineering", "Project Management"],
                correct: 1,
                explanation: "تحليل وتصميم النظم هو العملية التنظيمية المعقدة التي يتم من خلالها تطوير وصيانة نظم المعلومات[cite: 793]."
            },
            {
                chapter: "Mod1",
                question: "2. Which of the following refers to computer software designed to support organizational functions or processes?",
                options: ["System Software", "Application Software", "Methodologies", "Techniques"],
                correct: 1,
                explanation: "برمجيات التطبيقات (Application Software) مصممة خصيصاً لدعم وظائف وعمليات المنظمة[cite: 793]."
            },
            {
                chapter: "Mod1",
                question: "3. An organizational role most responsible for the analysis and design of information systems is:",
                options: ["Programmer", "Database Administrator", "Systems Analyst", "Project Sponsor"],
                correct: 2,
                explanation: "محلل النظم (Systems Analyst) هو المسؤول الرئيسي عن دراسة مشاكل واحتياجات المنظمة لتطوير أنظمة المعلومات[cite: 794]."
            },
            {
                chapter: "Mod1",
                question: "4. Comprehensive, multiple-step approaches to systems development that will guide your work and influence the quality of your final product are called:",
                options: ["Methodologies", "Techniques", "Tools", "Software"],
                correct: 0,
                explanation: "المنهجيات (Methodologies) هي أساليب شاملة ومتعددة الخطوات لتطوير النظم توجه عملك وتؤثر على جودة المنتج النهائي[cite: 795]."
            },
            {
                chapter: "Mod1",
                question: "5. Particular processes that an analyst will follow to ensure the work is well thought out, complete, and comprehensible to others are called:",
                options: ["Tools", "Systems", "Techniques", "Prototypes"],
                correct: 2,
                explanation: "التقنيات (Techniques) هي العمليات المحددة التي يتبعها المحلل لضمان إنجاز العمل بشكل مدروس وكامل[cite: 796]."
            },
            {
                chapter: "Mod1",
                question: "6. Typical computer programs that make it easy to use and benefit from techniques are known as:",
                options: ["Methodologies", "Tools", "Techniques", "Frameworks"],
                correct: 1,
                explanation: "الأدوات (Tools) هي البرامج الحاسوبية التي تسهل استخدام التقنيات وتطبيق المنهجيات في تطوير النظم[cite: 796]."
            },
            {
                chapter: "Mod1",
                question: "7. Which phase of the Systems Development Life Cycle (SDLC) involves identifying, analyzing, prioritizing, and arranging an organization's total information system needs?",
                options: ["Analysis", "Implementation", "Design", "Planning"],
                correct: 3,
                explanation: "مرحلة التخطيط (Planning) هي المرحلة الأولى التي يتم فيها تحديد وتحليل وترتيب أولويات احتياجات النظام بشكل كامل[cite: 802]."
            },
            {
                chapter: "Mod1",
                question: "8. The phase of the SDLC in which system requirements are studied and structured is:",
                options: ["Planning", "Design", "Analysis", "Implementation"],
                correct: 2,
                explanation: "مرحلة التحليل (Analysis) هي المرحلة الثانية التي يتم فيها دراسة وهيكلة متطلبات النظام[cite: 803]."
            },
            {
                chapter: "Mod1",
                question: "9. The phase in which the description of the recommended solution is converted into logical and physical system specifications is called:",
                options: ["Planning", "Analysis", "Implementation", "Design"],
                correct: 3,
                explanation: "مرحلة التصميم (Design) هي المرحلة الثالثة حيث تُحوّل الحلول الموصى بها إلى مواصفات منطقية وفيزيائية[cite: 804]."
            },
            {
                chapter: "Mod1",
                question: "10. In which SDLC phase do analysts turn system specifications into a working system that is tested and then put into use?",
                options: ["Implementation", "Maintenance", "Design", "Analysis"],
                correct: 0,
                explanation: "في مرحلة التنفيذ (Implementation)، يتم تحويل مواصفات النظام إلى نظام فعّال يعمل ويُختبر ليدخل حيز الاستخدام[cite: 805]."
            },
            {
                chapter: "Mod1",
                question: "11. The final phase of the SDLC where an information system is systematically repaired and improved is:",
                options: ["Maintenance", "Implementation", "Design", "Testing"],
                correct: 0,
                explanation: "الصيانة (Maintenance) هي المرحلة النهائية التي يتم فيها إصلاح وتحسين النظام بشكل منهجي[cite: 806]."
            },
            {
                chapter: "Mod1",
                question: "12. An approach to software development with short, incremental development cycles, automated tests, and two-person programming teams is known as:",
                options: ["Traditional Waterfall", "eXtreme Programming", "Joint Application Design", "Prototyping"],
                correct: 1,
                explanation: "البرمجة القصوى (eXtreme Programming) هي نهج يعتمد على دورات تطوير قصيرة واختبارات آلية وعمل المبرمجين في أزواج[cite: 816]."
            },
            {
                chapter: "Mod1",
                question: "13. Turning over responsibility for some or all of an organization's information systems applications and operations to an outside firm is called:",
                options: ["In-house development", "Cloud computing", "Outsourcing", "Software Reuse"],
                correct: 2,
                explanation: "التعهيد (Outsourcing) يعني نقل مسؤولية تطوير أو تشغيل النظم جزئياً أو كلياً إلى شركة خارجية[cite: 823]."
            },
            {
                chapter: "Mod1",
                question: "14. Off-the-shelf software systems that cannot be modified to meet the specific, individual needs of a particular organization are called:",

                explanation: "الأنظمة الجاهزة للتشغيل (Turnkey systems) هي برمجيات جاهزة لا يمكن تعديلها لتلبية الاحتياجات الفردية المحددة للمنظمة[cite: 826]."
            },
            {
                chapter: "Mod1",
                question: "15. The provision of applications or related services over the Internet, where customers do not have to invest in the hardware and software resources needed, is called:",

                explanation: "الحوسبة السحابية (Cloud computing) تتيح تقديم التطبيقات والخدمات عبر الإنترنت دون حاجة العميل للاستثمار في البنية التحتية[cite: 827]."
            },
            {

                explanation: "البرمجيات مفتوحة المصدر (Open-source software) تتيح الكود المصدري للمنتج النهائي بشكل مجاني للجميع[cite: 828]."
            },
            {
                chapter: "Mod1",
                question: "17. The use of previously written software resources (objects and components) in new applications is called:",
                options: ["Software Reuse", "Prototyping", "Outsourcing", "Cloud Computing"],
                correct: 0,
                explanation: "إعادة استخدام البرمجيات (Software Reuse) تعني استخدام الموارد أو المكونات البرمجية المكتوبة مسبقاً في تطبيقات جديدة[cite: 833]."
            },
            {
                chapter: "Mod1",
                question: "18. Which approach to software reuse mandates the development and sharing of reusable assets, and establishes organizational policies for documentation and packaging?",

                explanation: "في النهج المدار (Managed reuse)، يُفرض تطوير ومشاركة الأصول القابلة لإعادة الاستخدام وتُوضع سياسات تنظيمية لذلك[cite: 838]."
            },
            {
                chapter: "Mod1",
                question: "19. Which of the following is NOT an approach of software reuse?",

            {

                question: "100. During requirements determination, assuming that anything is possible and eliminating the infeasible is a characteristic of:",
                options: ["Attention to details", "Relaxing constraints", "Impertinence", "Impartiality"],
                correct: 1,
                explanation: "تخفيف القيود (Relaxing constraints) يتطلب من المحلل افتراض أن كل شيء ممكن في البداية ثم البدء باستبعاد الأمور غير الممكنة لاحقاً[cite: 966]."

        let questions = [];
        let userAnswers = [];
        let currentIdx = 0;
        let currentFilter = 'ALL';
        let currentLimit = 100;

        const questionCounter = document.getElementById('question-counter');
        const chapterBadge = document.getElementById('chapter-badge');
        const statusBadge = document.getElementById('status-badge');
        const scoreTracker = document.getElementById('score-tracker');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationBox = document.getElementById('explanation-box');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const finalScoreText = document.getElementById('final-score-text');
        const finalDetailsText = document.getElementById('final-details-text');
        const retryWrongBtn = document.getElementById('retry-wrong-btn');
        const wrongCountNum = document.getElementById('wrong-count-num');

        function filterChapter(ch) {
            currentFilter = ch;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${ch}`).classList.add('active');
            applyFilterAndLimit(false);
        }

        function setQuestionLimit(limit) {
            currentLimit = limit === 100 ? allQuestions.length : limit;
            document.querySelectorAll('.limit-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`limit-${limit}`).classList.add('active');
            applyFilterAndLimit(true);
        }

        function applyFilterAndLimit(shouldShuffle = false) {
            let pool = (currentFilter === 'ALL') 
                ? [...allQuestions] 
                : allQuestions.filter(q => q.chapter === currentFilter);

            if (shouldShuffle) {
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
            }

            questions = pool.slice(0, Math.min(currentLimit, pool.length));
            startQuizSession();
        }

        function shuffleCurrentPool() {
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            startQuizSession();
        }

        let isAutoNext = false;
        function toggleAutoNext() {
            isAutoNext = !isAutoNext;
            const icon = document.getElementById('auto-next-icon');
            const btn = document.getElementById('auto-next-toggle');
            if (isAutoNext) {
                icon.className = 'fa-solid fa-toggle-on text-emerald-500 text-sm transition-all';
                btn.classList.remove('text-gray-400');
                btn.classList.add('text-emerald-500');
            } else {
                icon.className = 'fa-solid fa-toggle-off text-gray-500 text-sm transition-all';
                btn.classList.remove('text-emerald-500');
                btn.classList.add('text-gray-400');
            }
        }

        function startQuizSession() {
            currentIdx = 0;
            userAnswers = new Array(questions.length).fill(null);
            updateScoreTracker();
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            loadQuestion();
        }

        function getCurrentScore() {
            return userAnswers.reduce((acc, ans, idx) => {
                return acc + (ans === questions[idx].correct ? 1 : 0);
            }, 0);
        }

        function updateScoreTracker() {
            const currentScore = getCurrentScore();
            document.getElementById('score-tracker').innerText = `الصحيحة: ${currentScore}`;
            if (document.getElementById('score-tracker-mobile')) {
                document.getElementById('score-tracker-mobile').innerText = currentScore;
            }
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            const savedAnswer = userAnswers[currentIdx];

            questionCounter.innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            chapterBadge.innerText = q.chapter;
            progressBar.style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            questionText.innerText = q.question;

            const telegramUsername = "Fahad_m7md";
            const qNumMatch = q.question.match(/^\d+/);
            const qOriginalNum = qNumMatch ? qNumMatch[0] : (currentIdx + 1);
            const reportMessage = `IT353 (Models 1-5):\n- رقم السؤال: (${qOriginalNum})\n- الوحدة: (${q.chapter})\n- السؤال: "${q.question}"\n\nالملاحظة: `;
            document.getElementById('report-btn').href = `https://t.me/${telegramUsername}?text=${encodeURIComponent(reportMessage)}`;
            
            prevBtn.disabled = (currentIdx === 0);
            nextBtn.innerHTML = (currentIdx === questions.length - 1) 
                ? `النتيجة النهائية <i class="fa-solid fa-flag-checkered mr-2"></i>` 
                : `التالي <i class="fa-solid fa-arrow-left mr-2"></i>`;

            optionsContainer.innerHTML = '';

            if (savedAnswer === null) {
                statusBadge.className = "bg-gray-800 text-gray-400 text-xs px-3 py-1 rounded-full shadow-sm";
                statusBadge.innerText = "لم تتم الإجابة";
                statusBadge.classList.remove('hidden');
                explanationBox.classList.add('hidden');
            } else if (savedAnswer === q.correct) {
                statusBadge.className = "bg-emerald-500/20 text-emerald-500 text-xs px-3 py-1 rounded-full font-bold shadow-sm";
                statusBadge.innerText = "إجابة صحيحة";
                statusBadge.classList.remove('hidden');
            } else {
                statusBadge.className = "bg-rose-500/20 text-rose-500 text-xs px-3 py-1 rounded-full font-bold shadow-sm";
                statusBadge.innerText = "إجابة خاطئة";
                statusBadge.classList.remove('hidden');
            }

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                
                if (savedAnswer === null) {
                    btn.className = "option-btn w-full text-left p-4 rounded-xl border border-gray-700 bg-gray-900/60 text-gray-200 font-medium flex justify-between items-center gap-3";
                    btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-500 shrink-0"></i>`;
                    btn.onclick = () => selectAnswer(index);
                } else {
                    btn.disabled = true;
                    if (index === q.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-500/20 text-white font-bold flex justify-between items-center gap-3";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-check text-emerald-500 shrink-0"></i>`;
                    } else if (index === savedAnswer && savedAnswer !== q.correct) {
                        btn.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-500/20 text-white font-bold flex justify-between items-center gap-3";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-xmark text-rose-500 shrink-0"></i>`;
                    } else {
                        btn.className = "w-full text-left p-4 rounded-xl border border-gray-800 bg-gray-900/40 text-gray-500 font-medium flex justify-between items-center gap-3 opacity-60";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-gray-600 shrink-0"></i>`;
                    }
                }
                optionsContainer.appendChild(btn);
            });

            if (savedAnswer !== null) {
                explanationBox.innerHTML = `<strong class="text-cyan">توضيح:</strong> ${q.explanation}`;
                explanationBox.classList.remove('hidden');
            }
        }

        function selectAnswer(selectedIdx) {
            userAnswers[currentIdx] = selectedIdx;
            updateScoreTracker();
            loadQuestion();

            if (isAutoNext && selectedIdx === questions[currentIdx].correct) {
                setTimeout(() => {
                    nextQuestion();
                }, 900);
            }
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            
            const finalScore = getCurrentScore();
            const total = questions.length;
            const percentage = Math.round((finalScore / total) * 100);
            
            let wrongOnlyCount = 0;
            let unansweredCount = 0;
            
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === null) {
                    unansweredCount++;
                } else if (userAnswers[idx] !== q.correct) {
                    wrongOnlyCount++;
                }
            });

            finalScoreText.innerText = `حصلت على ${finalScore} من ${total} (${percentage}%)`;
            finalDetailsText.innerText = `إجابات صحيحة: ${finalScore} | إجابات خاطئة: ${wrongOnlyCount} | لم تتم الإجابة: ${unansweredCount}`;

            const reviewPoolCount = wrongOnlyCount + unansweredCount;
            if (reviewPoolCount > 0) {
                wrongCountNum.innerText = reviewPoolCount;
                retryWrongBtn.classList.remove('hidden');
            } else {
                retryWrongBtn.classList.add('hidden');
            }
        }

        function retryWrongQuestions() {
            const wrongQuestions = questions.filter((q, idx) => userAnswers[idx] !== q.correct);
            if (wrongQuestions.length > 0) {
                questions = wrongQuestions;
                startQuizSession();
            }
        }

        applyFilterAndLimit(false);
    </script>
