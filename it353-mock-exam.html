        const themeIcon = document.getElementById('theme-icon');
        function updateThemeIcon() {
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.className = 'fa-solid fa-moon text-primary text-[10px] md:text-xs';
            } else {
                themeIcon.className = 'fa-solid fa-sun text-amber-500 text-[10px] md:text-xs';
            }
        }
        updateThemeIcon();

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        const allQuestions = [
            // ================= MODULE 1 (8 Questions) =================
            {
                chapter: "Mod1",
                question: "1. Which statement best describes information systems analysis and design?",
                options: [
                    "Configuring the hardware and network used to run applications",
                    "Testing a completed system before it is placed into service",
                    "Writing and executing program code for a defined specification",
                    "Developing and maintaining computer-based information systems within an organization"
                ],
                correct: 3,
                explanation: "تحليل وتصميم النظم هو العملية التنظيمية المعقدة لتطوير وصيانة نظم المعلومات الحاسوبية داخل المنظمة."
            },
            {
                chapter: "Mod1",
                question: "2. A development team adopts a phased approach for its projects, uses interviews to gather requirements, and records system diagrams in a software package. How should these three elements be classified, in that order?",
                options: [
                    "Methodology, technique, tool",
                    "Technique, methodology, tool",
                    "Methodology, tool, technique",
                    "Tool, technique, methodology"
                ],
                correct: 0,
                explanation: "النهج المرحلي يمثل المنهجية (Methodology)، والمقابلات تمثل التقنية (Technique)، وبرنامج الرسم يمثل الأداة (Tool)."
            },
            {
                chapter: "Mod1",
                question: "3. What is the correct order of the Systems Development Life Cycle (SDLC) phases?",
                options: [
                    "Planning, Design, Analysis, Implementation, Maintenance",
                    "Planning, Analysis, Design, Implementation, Maintenance",
                    "Analysis, Planning, Design, Implementation, Maintenance",
                    "Design, Planning, Analysis, Implementation, Maintenance"
                ],
                correct: 1,
                explanation: "الترتيب الصحيح لمراحل SDLC هو: التخطيط، التحليل، التصميم، التنفيذ، ثم الصيانة."
            },
            {
                chapter: "Mod1",
                question: "4. Which part of the design phase of the SDLC describes all functional features of the system independently of any computer platform?",
                options: [
                    "Physical design",
                    "Logical design",
                    "Semantic design",
                    "Architectural design"
                ],
                correct: 1,
                explanation: "التصميم المنطقي (Logical design) يصف جميع الخصائص الوظيفية للنظام بشكل مستقل عن أي منصة حاسوبية أو تقنية."
            },
            {
                chapter: "Mod1",
                question: "5. Which of the following best describes eXtreme Programming (XP)?",
                options: [
                    "A hardware installation technique focusing on performance testing",
                    "An agile method using short, incremental cycles, pair programming, and automated continuous testing",
                    "A software development approach emphasizing long development cycles and individual coding",
                    "A project management tool used for scheduling and budgeting"
                ],
                correct: 1,
                explanation: "البرمجة القصوى (XP) هي منهجية رشيقة تعتمد على دورات تطوير قصيرة، والبرمجة الزوجية (Pair programming)، والاختبارات الآلية المستمرة."
            },

        // وظائف الأزرار والتصفية
        function filterChapter(ch) {
            currentFilter = ch;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${ch}`).classList.add('active');
            applyFilterAndLimit(false);
        }

        function setQuestionLimit(limit) {
            currentLimit = limit === 150 ? allQuestions.length : limit;
            document.querySelectorAll('.limit-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`limit-${limit}`).classList.add('active');
            applyFilterAndLimit(true);
        }

        function applyFilterAndLimit(shouldShuffle = false) {
            let pool = [];
            if (currentFilter === 'ALL') {
                pool = [...allQuestions];
            } else if (currentFilter === 'MID') {
                pool = allQuestions.filter(q => ['Mod1', 'Mod2', 'Mod3', 'Mod4', 'Mod5'].includes(q.chapter));
            } else if (currentFilter === 'POST5') {
                pool = allQuestions.filter(q => ['Mod6', 'Mod7', 'Mod8', 'Mod9', 'Mod10', 'Mod11', 'Mod12', 'Mod13'].includes(q.chapter));
            } else {
                pool = allQuestions.filter(q => q.chapter === currentFilter);
            }

            if (shouldShuffle) {
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
            }

            questions = pool.slice(0, Math.min(currentLimit, pool.length));
            startQuizSession();
        }

        function shuffleCurrentPool() {
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            startQuizSession();
        }

        // التجاوز التلقائي
        let isAutoNext = false;
        function toggleAutoNext() {
            isAutoNext = !isAutoNext;
            const icon = document.getElementById('auto-next-icon');
            const btn = document.getElementById('auto-next-toggle');
            if (isAutoNext) {
                icon.className = 'fa-solid fa-toggle-on text-emerald-500 text-sm transition-all';
                btn.classList.remove('text-slate-400', 'dark:text-gray-400');
                btn.classList.add('text-emerald-500', 'dark:text-emerald-500');
            } else {
                icon.className = 'fa-solid fa-toggle-off text-slate-400 dark:text-gray-500 text-sm transition-all';
                btn.classList.remove('text-emerald-500', 'dark:text-emerald-500');
                btn.classList.add('text-slate-500', 'dark:text-gray-400');
            }
        }

        // تهيئة الجلسة
        function startQuizSession() {
            currentIdx = 0;
            userAnswers = new Array(questions.length).fill(null);
            updateScoreTracker();
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            loadQuestion();
        }

        function getCurrentScore() {
            return userAnswers.reduce((acc, ans, idx) => {
                return acc + (ans === questions[idx].correct ? 1 : 0);
            }, 0);
        }

        function updateScoreTracker() {
            const currentScore = getCurrentScore();
            document.getElementById('score-tracker').innerText = `الصحيحة: ${currentScore}`;
            if (document.getElementById('score-tracker-mobile')) {
                document.getElementById('score-tracker-mobile').innerText = currentScore;
            }
        }

        // بناء وعرض السؤال
        function loadQuestion() {
            const q = questions[currentIdx];
            const savedAnswer = userAnswers[currentIdx];

            questionCounter.innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
            chapterBadge.innerText = q.chapter;
            progressBar.style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            questionText.innerText = q.question;

            // تحديث زر الإبلاغ
            const telegramUsername = "Fahad_m7md";
            const qNumMatch = q.question.match(/^\d+/);
            const qOriginalNum = qNumMatch ? qNumMatch[0] : (currentIdx + 1);
            const reportMessage = `IT353 (Final Bank - Modules 1-13):\n- رقم السؤال: (${qOriginalNum})\n- الوحدة: (${q.chapter})\n- السؤال: "${q.question}"\n\nالملاحظة: `;
            document.getElementById('report-btn').href = `https://t.me/${telegramUsername}?text=${encodeURIComponent(reportMessage)}`;
            
            // حالة أزرار التنقل
            prevBtn.disabled = (currentIdx === 0);
            nextBtn.innerHTML = (currentIdx === questions.length - 1)

                : `التالي <i class="fa-solid fa-arrow-left mr-1 md:mr-2"></i>`;

            // بناء الخيارات بطريقة برمجية وآمنة 100%
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                
                if (savedAnswer === null) {
                    btn.className = "w-full text-left p-3 md:p-4 rounded-xl border border-slate-300 dark:border-gray-700 bg-white dark:bg-gray-900/60 text-slate-700 dark:text-gray-200 text-sm md:text-base font-medium flex justify-between items-center gap-2 md:gap-3 hover:border-primary dark:hover:border-primary hover:bg-primary/5 dark:hover:bg-primary/10 transition-all";
                    btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-slate-400 dark:text-gray-500 shrink-0"></i>`;
                    
                    btn.addEventListener('click', function() {
                        selectAnswer(index);
                    });
                } else {
                    btn.disabled = true;
                    if (index === q.correct) {
                        btn.className = "w-full text-left p-3 md:p-4 rounded-xl border border-emerald-500 bg-emerald-50 dark:bg-emerald-500/20 text-emerald-700 dark:text-white text-sm md:text-base font-bold flex justify-between items-center gap-2 md:gap-3 transition-all";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-500 shrink-0"></i>`;
                    } else if (index === savedAnswer && savedAnswer !== q.correct) {
                        btn.className = "w-full text-left p-3 md:p-4 rounded-xl border border-rose-500 bg-rose-50 dark:bg-rose-500/20 text-rose-700 dark:text-white text-sm md:text-base font-bold flex justify-between items-center gap-2 md:gap-3 transition-all";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-xmark text-rose-600 dark:text-rose-500 shrink-0"></i>`;
                    } else {
                        btn.className = "w-full text-left p-3 md:p-4 rounded-xl border border-slate-200 dark:border-gray-800 bg-slate-50 dark:bg-gray-900/40 text-slate-400 dark:text-gray-500 text-sm md:text-base font-medium flex justify-between items-center gap-2 md:gap-3 opacity-60 transition-all";
                        btn.innerHTML = `<span>${opt}</span> <i class="fa-regular fa-circle text-slate-300 dark:text-gray-600 shrink-0"></i>`;

                }
                optionsContainer.appendChild(btn);
            });

            // الشرح والبادج
            if (savedAnswer === null) {
                statusBadge.className = "bg-slate-200 dark:bg-gray-800 text-slate-500 dark:text-gray-400 text-[10px] md:text-xs px-2.5 py-1 rounded-full shadow-sm";
                statusBadge.innerText = "لم تتم الإجابة";
                statusBadge.classList.remove('hidden');
                explanationBox.classList.add('hidden');
            } else {
                if (savedAnswer === q.correct) {
                    statusBadge.className = "bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-500 text-[10px] md:text-xs px-2.5 py-1 rounded-full font-bold shadow-sm";

                } else {
                    statusBadge.className = "bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-500 text-[10px] md:text-xs px-2.5 py-1 rounded-full font-bold shadow-sm";

                }
                statusBadge.classList.remove('hidden');
                explanationBox.innerHTML = `<strong class="text-cyan">توضيح:</strong> ${q.explanation}`;
                explanationBox.classList.remove('hidden');
            }
        }

        function selectAnswer(selectedIdx) {
            userAnswers[currentIdx] = selectedIdx;
            updateScoreTracker();
            loadQuestion();

            // الانتقال التلقائي
            if (isAutoNext && selectedIdx === questions[currentIdx].correct) {
                setTimeout(() => {
                    nextQuestion();
                }, 600);
            }
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            
            const finalScore = getCurrentScore();
            const total = questions.length;
            const percentage = Math.round((finalScore / total) * 100);
            
            let wrongOnlyCount = 0;
            let unansweredCount = 0;
            
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === null) {
                    unansweredCount++;
                } else if (userAnswers[idx] !== q.correct) {
                    wrongOnlyCount++;
                }
            });

            finalScoreText.innerText = `حصلت على ${finalScore} من ${total} (${percentage}%)`;
            finalDetailsText.innerText = `إجابات صحيحة: ${finalScore} | إجابات خاطئة: ${wrongOnlyCount} | لم تتم الإجابة: ${unansweredCount}`;

            const reviewPoolCount = wrongOnlyCount + unansweredCount;
            if (reviewPoolCount > 0) {
                wrongCountNum.innerText = reviewPoolCount;
                retryWrongBtn.classList.remove('hidden');
            } else {
                retryWrongBtn.classList.add('hidden');
            }
        }

        function retryWrongQuestions() {
            const wrongQuestions = questions.filter((q, idx) => userAnswers[idx] !== q.correct);
            if (wrongQuestions.length > 0) {
                questions = wrongQuestions;
                startQuizSession();
            }
        }

        // تشغيل التهيئة الأولية
        applyFilterAndLimit(false);
    </script>
</body>
</html>
